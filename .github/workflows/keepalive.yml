# Keeps the free Supabase server awake (free projects pause after ~7 days without database activity)
# and keeps this schedule itself alive (GitHub pauses scheduled workflows in repos idle for 60 days).
name: Server wach halten
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (tiny database request)
        env:
          KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmam90eWFkbmhucGJjcWdoYnJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MzQ5OTMsImV4cCI6MjEwNzIxMDk5M30._2BRz82mW_lQ20fN_g0RwxVfOdA72kx5RjkWSn1IEXw
        run: |
          for i in 1 2 3; do
            curl -fsS -X POST "https://dfjotyadnhnpbcqghbrn.supabase.co/rest/v1/rpc/funkel_ping" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}' && exit 0
            sleep 20
          done
          exit 1
      - uses: actions/checkout@v4
      - name: Keep the schedule alive
        run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 40 ]; then
            date -u +%FT%TZ > .keepalive
            git config user.name "funkel-keepalive"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive && git commit -m "keepalive" && git push
          fi
