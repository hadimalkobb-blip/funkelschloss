  /* Eisschloss (default world) */
  --sky1:#8fcaf2; --sky2:#e6f5ff; --sky3:#ffffff;
  --far:#c9e4f7; --hill1:#dff1fc; --hill2:#b4d8f0;
  --castle:#f6fcff; --castle-sh:#c3e0f3; --roof:#4f9fd6; --roof-sh:#3a86bd; --win:#ffe9a3; --flag:#f4b740;
  --ink:#0f2f4c; --ink-soft:#40617f;
  --accent:#2a78bd; --accent-2:#7cc4f2; --accent-ink:#ffffff;
  --glass:rgba(255,255,255,.66); --glass-2:rgba(255,255,255,.42); --glass-line:rgba(255,255,255,.9);
  --paper:#ffffff; --paper-2:#f3f8fc; --paper-ink:#18232e; --paper-line:#dbe7f1;
  --gold:#f2b134; --gold-2:#ffd978; --good:#23955a; --good-2:#c9f0d9; --warm:#e06a3a; --warm-2:#ffe0d2;
  --shade:rgba(15,47,76,.18); --veil:rgba(10,30,52,.42);
  --s1:#1f6fd1; --s2:#d62f3a;
  --fscale:1;
  color-scheme:light;
}
:root[data-world="garten"]{
  --sky1:#ffc9d9; --sky2:#fff0f3; --sky3:#fffaf6;
  --far:#f6d3e0; --hill1:#9fdb93; --hill2:#5fb25c;
  --castle:#ffe3ea; --castle-sh:#f3b4c6; --roof:#d9487c; --roof-sh:#b8335f; --win:#fff2b8; --flag:#ffd34d;
  --ink:#4a1830; --ink-soft:#7d4660;
  --accent:#c93a71; --accent-2:#ff9dbf; --accent-ink:#ffffff;
  --glass:rgba(255,255,255,.68); --glass-2:rgba(255,255,255,.45); --glass-line:rgba(255,255,255,.92);
  --paper-2:#fff6f8; --paper-line:#f3dde5;
  --shade:rgba(74,24,48,.16); --veil:rgba(60,18,40,.42);
}
:root[data-world="nacht"]{
  --sky1:#0d1238; --sky2:#272c6a; --sky3:#463f8c;
  --far:#1d2155; --hill1:#1a1f4b; --hill2:#10143a;
  --castle:#b7b0ea; --castle-sh:#8a82cd; --roof:#5b4fb4; --roof-sh:#463b98; --win:#ffd36a; --flag:#ffcf5a;
  --ink:#f4f1ff; --ink-soft:#c9c3f2;
  --accent:#ffcf5a; --accent-2:#8f86e6; --accent-ink:#20194d;
  --glass:rgba(30,32,88,.62); --glass-2:rgba(40,42,100,.45); --glass-line:rgba(190,182,255,.38);
  --paper:#fffdf7; --paper-2:#f4f1ff; --paper-ink:#1c1840; --paper-line:#e1dcf7;
  --shade:rgba(0,0,0,.35); --veil:rgba(5,6,24,.6);
  color-scheme:dark;
}
:root[data-world="bucht"]{
  --sky1:#7fdbe3; --sky2:#e3fbf8; --sky3:#ffffff;
  --far:#b9ece9; --hill1:#f3e1b5; --hill2:#e7c98c;
  --castle:#f8e6c8; --castle-sh:#e3c597; --roof:#1f97a3; --roof-sh:#167d88; --win:#fff1b0; --flag:#ff8f6b;
  --ink:#0b3a40; --ink-soft:#3a6a70;
  --accent:#117d89; --accent-2:#6fd3db; --accent-ink:#ffffff;
  --paper-2:#f2fbfb; --paper-line:#d3ecec;
  --shade:rgba(11,58,64,.17); --veil:rgba(6,40,45,.42);
}
:root[data-world="zucker"]{
  --sky1:#ffd6f1; --sky2:#efeaff; --sky3:#fff8fd;
  --far:#f1d6ff; --hill1:#ffc6e6; --hill2:#c8b5ff;
  --castle:#fff2fb; --castle-sh:#f5c7e7; --roof:#ff7fc0; --roof-sh:#e05ea3; --win:#fff6b5; --flag:#7fd6ff;
  --ink:#45174d; --ink-soft:#7a4a83;
  --accent:#a8329b; --accent-2:#ff9fd6; --accent-ink:#ffffff;
  --paper-2:#fdf4fc; --paper-line:#f0daf0;
  --shade:rgba(69,23,77,.16); --veil:rgba(50,14,58,.42);
}
:root[data-world="herbst"]{
  --sky1:#ffcf96; --sky2:#fff0dc; --sky3:#fffaf2;
  --far:#f6d0a3; --hill1:#dd9446; --hill2:#a9592b;
  --castle:#f9e8d2; --castle-sh:#e3c39b; --roof:#b4483a; --roof-sh:#933529; --win:#fff0a8; --flag:#ffcc33;
  --ink:#3a2113; --ink-soft:#6f4a33;
  --accent:#b0442f; --accent-2:#f2a65a; --accent-ink:#ffffff;
  --paper-2:#fff8ef; --paper-line:#f0e0cc;
  --shade:rgba(58,33,19,.18); --veil:rgba(45,24,12,.45);
}
:root[data-syll="1"]{--s1:#d63a76;--s2:#6a43c9}
:root[data-syll="2"]{--s1:#178a50;--s2:#d4700e}
:root[data-syll="3"]{--s1:#0b8fa1;--s2:#c8378f}
:root[data-font="1"]{--fscale:1.12}
:root[data-font="2"]{--fscale:1.25}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--sky2);color:var(--ink);font-family:var(--font-read);font-size:18px;line-height:1.35;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
input,select{font:inherit}
.ar{font-family:var(--font-ar);direction:rtl;unicode-bidi:isolate}
[hidden]{display:none!important}

/* ---------- app frame ---------- */
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 58%,var(--sky3) 100%);overflow:hidden}
#scene{position:absolute;inset:0;pointer-events:none;z-index:0}
#scene svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:62%;}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
#app.ingame #scene{filter:saturate(.85)}
#app.ingame #scene::after{content:"";position:absolute;inset:0;background:var(--glass-2)}

/* ---------- top ribbon ---------- */
#bar{position:relative;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:68px;
  background:var(--glass);-webkit-backdrop-filter:blur(12px) saturate(1.3);backdrop-filter:blur(12px) saturate(1.3);border-bottom:1px solid var(--glass-line)}
#bar .grow{flex:1;min-width:0}
.wordmark{font-family:var(--font-show);font-weight:700;font-size:22px;letter-spacing:.02em;color:var(--ink);white-space:nowrap}
.bar-title{font-weight:700;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbtn{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--paper);color:var(--accent);box-shadow:0 3px 10px var(--shade);flex:none;transition:transform .12s}
.rbtn:active{transform:scale(.9)}
.rbtn svg{width:28px;height:28px}
.rbtn.small{width:42px;height:42px}
.rbtn.small svg{width:22px;height:22px}
.starpill{display:flex;align-items:center;gap:6px;height:46px;padding:0 14px 0 8px;border-radius:999px;background:var(--paper);color:var(--paper-ink);font-weight:700;font-size:20px;box-shadow:0 3px 10px var(--shade);font-variant-numeric:tabular-nums;flex:none}
.starpill svg{width:30px;height:30px}
.starpill.bump{animation:bump .5s}
.rank{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:240px}
.rank b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.rank .meter{height:8px;border-radius:99px;background:var(--glass-2);overflow:hidden;border:1px solid var(--glass-line)}
.rank .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));border-radius:99px}
@media (max-width:640px){.wordmark{font-size:17px}.rank{display:none}.rbtn{width:44px;height:44px}.rbtn svg{width:24px;height:24px}.starpill{height:42px;font-size:18px}#bar{gap:7px;padding:8px 10px}}

/* ---------- stage ---------- */
#stage{position:relative;z-index:2;overflow:hidden auto;-webkit-overflow-scrolling:touch;padding:16px 16px 110px;min-height:0}
#stage.fixed{overflow:hidden}
.screen{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-height:100%}
.center{display:flex;align-items:center;justify-content:center}
.col{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}
.muted{color:var(--ink-soft)}
.h1{font-family:var(--font-show);font-weight:700;font-size:clamp(26px,4.4vw,44px);text-align:center;color:var(--ink);text-wrap:balance;margin:0}
.h2{font-weight:700;font-size:24px;margin:0;color:var(--ink)}
.sub{font-size:18px;color:var(--ink-soft);text-align:center;margin:0}

/* ---------- crystal tiles (home) ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,1fr);gap:12px}}
.tile{--cut:16px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;padding:16px 10px 14px;min-height:178px;
  clip-path:polygon(var(--cut) 0,calc(100% - var(--cut)) 0,100% var(--cut),100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,var(--cut) 100%,0 calc(100% - var(--cut)),0 var(--cut));
  background:linear-gradient(155deg,var(--paper) 0%,var(--paper-2) 55%,var(--glass) 100%);color:var(--paper-ink);transition:transform .15s}
.tile::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.75) 0 18%,transparent 19% 100%);pointer-events:none;opacity:.55}
.tile:active{transform:scale(.95)}
.tile .ico{width:86px;height:86px;display:grid;place-items:center}
.tile .ico svg{width:86px;height:86px}
.tile .nm{font-weight:700;font-size:18px;text-align:center;line-height:1.15;text-wrap:balance}
.tile .nm-ar{font-size:14px;color:#6a7686;margin-top:-4px}
.tile.locked{filter:saturate(.25) brightness(.96)}
.tile.locked .ico{opacity:.45}
.tile .lock{position:absolute;top:10px;right:12px;display:flex;align-items:center;gap:4px;font-weight:700;font-size:15px;color:#6b5a2a;background:var(--gold-2);border-radius:99px;padding:2px 9px 2px 6px}
.tile .lock svg{width:16px;height:16px}
.tile .newdot{position:absolute;top:12px;left:14px;font-size:13px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:2px 8px}
.tile.wide{grid-column:span 2;flex-direction:row;justify-content:flex-start;gap:16px;padding:16px 20px;min-height:150px;text-align:left}
.tile.wide .txt{display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:0}
.tile.wide .nm{text-align:left;font-size:22px}
.tile.wide .why{font-size:16px;color:#55606c}
.tile.glow{background:linear-gradient(140deg,var(--gold-2) 0%,var(--paper) 45%,var(--paper-2) 100%)}
@media (max-width:520px){.tile.wide{grid-column:1 / -1}.tile{min-height:160px}.tile .ico,.tile .ico svg{width:70px;height:70px}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:60px;padding:0 26px;border-radius:999px;font-weight:700;font-size:21px;
  background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 0 rgba(0,0,0,.12),0 10px 22px var(--shade);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.12),0 6px 14px var(--shade)}
.btn svg{width:28px;height:28px}
.btn.soft{background:var(--paper);color:var(--paper-ink)}
.btn.gold{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#4a3300}
.btn.small{min-height:48px;font-size:18px;padding:0 18px}
.btn.icon{width:64px;min-width:64px;padding:0}
.btn[disabled]{opacity:.45;pointer-events:none}
.pillset{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pill{min-height:52px;padding:0 18px;border-radius:999px;background:var(--paper);color:var(--paper-ink);font-weight:700;box-shadow:0 3px 10px var(--shade);display:inline-flex;align-items:center;gap:8px}
.pill.on{background:var(--accent);color:var(--accent-ink)}

/* ---------- paper & reading ---------- */
.paper{background:var(--paper);color:var(--paper-ink);border-radius:26px;box-shadow:0 12px 30px var(--shade);padding:20px}
.word{font-family:var(--font-read);font-weight:700;letter-spacing:.01em;white-space:nowrap;display:inline-flex;align-items:baseline}
.syl{display:inline-flex;position:relative}
.hint-syl .syl.s1{color:var(--s1)} .hint-syl .syl.s2{color:var(--s2)}
.g{display:inline-block}
.hint-team .team{position:relative;border-radius:.42em;padding:0 .06em;margin:0 .02em;box-shadow:inset 0 0 0 .07em currentColor}
.hint-team .team.t-ei,.hint-team .team.t-ai{border-radius:50%/58%;background:rgba(242,177,52,.22);box-shadow:inset 0 0 0 .07em #e2a21c;padding:0 .14em}
.hint-team .team.t-ie,.hint-team .team.t-ee,.hint-team .team.t-aa,.hint-team .team.t-oo{background:rgba(214,58,118,.10);padding:0 .22em 0 .08em;border-radius:.6em}
.hint-team .team.t-ie .fade,.hint-team .team.t-ee .fade,.hint-team .team.t-aa .fade,.hint-team .team.t-oo .fade{opacity:.42}
.hint-team .team.t-ie::after,.hint-team .team.t-ee::after,.hint-team .team.t-aa::after,.hint-team .team.t-oo::after{content:"";position:absolute;left:.1em;right:.25em;bottom:-.12em;height:.07em;border-radius:9px;background:currentColor;opacity:.55}
.hint-team .team.t-sch{background:rgba(120,70,200,.12)}
.hint-team .team.t-ch{background:rgba(16,150,160,.12)}
.hint-team .team.t-au{background:rgba(230,120,30,.13)}
.hint-team .team.t-eu,.hint-team .team.t-äu{background:rgba(40,110,220,.12)}
.hint-team .team.t-ck,.hint-team .team.t-tz,.hint-team .team.t-pf,.hint-team .team.t-qu,.hint-team .team.t-sp,.hint-team .team.t-st{box-shadow:inset 0 0 0 .06em rgba(0,0,0,.28);border-radius:.3em}
.tok{display:inline-block;border-radius:.3em;padding:0 .06em;transition:background .15s}
.tok.now{background:var(--gold-2);box-shadow:0 0 0 .12em var(--gold-2)}
.sentence{font-family:var(--font-read);font-weight:700;font-size:calc(clamp(30px,5.4vw,52px) * var(--fscale));line-height:1.45;text-align:center;text-wrap:balance}
.sentence .w{white-space:nowrap}
.bigletter{font-family:var(--font-read);font-weight:700;font-size:clamp(96px,24vmin,230px);line-height:1;color:var(--paper-ink)}
.emoji{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;line-height:1}

/* ---------- options & feedback ---------- */
.opts{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));width:100%;max-width:820px;margin:0 auto}
.opt{position:relative;min-height:110px;border-radius:26px;background:var(--paper);color:var(--paper-ink);box-shadow:0 7px 0 rgba(0,0,0,.08),0 12px 24px var(--shade);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;font-weight:700;font-size:calc(34px * var(--fscale));transition:transform .12s}
.opt:active{transform:scale(.95)}
.opt .emoji{font-size:62px}
.opt.txt{font-size:calc(30px * var(--fscale))}
.opt.ok{background:var(--good-2);box-shadow:0 0 0 5px var(--good),0 12px 24px var(--shade);animation:pop .45s}
.opt.no{animation:shake .45s;background:var(--warm-2)}
.opt.hint{animation:glowpulse 1s infinite}
.opt .say{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;background:var(--paper-2);display:grid;place-items:center;color:var(--accent)}
.opt .say svg{width:22px;height:22px}
.dots{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--glass-2);border:2px solid var(--glass-line)}
.dots i.done{background:var(--gold);border-color:var(--gold-2)}
.dots i.now{background:var(--paper);border-color:var(--accent)}
.prompt{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.prompt .emoji.big{font-size:clamp(90px,18vmin,170px);filter:drop-shadow(0 8px 14px var(--shade));animation:float 3.2s ease-in-out infinite}
.qline{font-size:calc(24px * var(--fscale));font-weight:700;color:var(--ink);text-align:center}
.toolrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
@keyframes glowpulse{0%,100%{box-shadow:0 0 0 4px var(--gold),0 12px 24px var(--shade)}50%{box-shadow:0 0 0 12px var(--gold-2),0 12px 24px var(--shade)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes wave{0%,100%{transform:skewY(0)}50%{transform:skewY(-8deg)}}

/* ---------- Nur, the speaking light ---------- */
#nur{position:fixed;z-index:20;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:76px;height:76px;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 42% 38%,#fff 0 22%,#fff6cf 34%,var(--gold-2) 52%,rgba(255,200,80,.0) 72%);
  filter:drop-shadow(0 0 14px rgba(255,214,110,.95)) drop-shadow(0 0 30px rgba(255,214,110,.55));animation:breathe 3.4s ease-in-out infinite}
#nur::before,#nur::after{content:"";position:absolute;inset:8px;border-radius:50%;border:2px solid rgba(255,230,150,.9);opacity:0}
#nur.talk{animation:breathe .55s ease-in-out infinite}
#nur.talk::before{animation:ring 1.2s ease-out infinite}
#nur.talk::after{animation:ring 1.2s ease-out .6s infinite}
#nur .spark{position:absolute;width:10px;height:10px;left:50%;top:50%;margin:-5px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;animation:orbit 4s linear infinite}
#nur .spark.b{animation-duration:6s;animation-direction:reverse;width:7px;height:7px;margin:-3.5px}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
@keyframes orbit{from{transform:rotate(0) translateX(46px) scale(1)}50%{transform:rotate(180deg) translateX(46px) scale(.6)}to{transform:rotate(360deg) translateX(46px) scale(1)}}
#bubble{position:fixed;z-index:19;left:104px;bottom:calc(22px + env(safe-area-inset-bottom,0px));max-width:min(620px,calc(100vw - 124px));
  background:var(--paper);color:var(--paper-ink);border-radius:22px 22px 22px 6px;padding:12px 18px;box-shadow:0 10px 26px var(--shade);animation:fadeup .25s}
#bubble .de{font-weight:700;font-size:calc(21px * var(--fscale));line-height:1.3}
#bubble .arr{font-size:16px;color:#6a7686;margin-top:4px}
@media (max-width:560px){#nur{width:62px;height:62px;left:10px}#bubble{left:80px;max-width:calc(100vw - 92px)}#bubble .de{font-size:18px}}

/* ---------- overlays ---------- */
#overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:var(--veil);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fadein .2s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sheet{width:min(720px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--paper);color:var(--paper-ink);border-radius:30px;padding:24px;box-shadow:0 30px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:18px;animation:fadeup .3s}
.sheet h2{font-family:var(--font-show);font-size:28px;margin:0;text-align:center}
.sheet .x{position:absolute}
.sheet-head{display:flex;align-items:center;gap:12px}
.sheet-head h2{flex:1;text-align:left}
#toast{position:fixed;z-index:40;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--paper);color:var(--paper-ink);font-weight:700;border-radius:99px;padding:10px 20px;box-shadow:0 10px 24px var(--shade);opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}
.flystar{position:fixed;z-index:45;width:42px;height:42px;pointer-events:none;transition:transform .75s cubic-bezier(.5,-0.2,.4,1),opacity .75s}

/* range sliders */
.slider{display:grid;grid-template-columns:44px 1fr 56px;align-items:center;gap:12px}
.slider svg{width:34px;height:34px;color:var(--accent)}
.slider output{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:99px;background:var(--paper-line);outline-offset:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:38px;border-radius:50%;background:var(--accent);border:4px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:34px;height:34px;border-radius:50%;background:var(--accent);border:4px solid #fff}

/* world picker */
.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.worldbtn{position:relative;height:150px;border-radius:24px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.18);text-align:left;color:#fff}
.worldbtn svg{position:absolute;inset:0;width:100%;height:100%}
.worldbtn span{position:absolute;left:12px;bottom:10px;right:10px;font-weight:700;font-size:18px;text-shadow:0 2px 6px rgba(0,0,0,.55)}
.worldbtn.on{outline:5px solid var(--gold);outline-offset:3px}

/* game specifics */
.trace-wrap{position:relative;width:min(100%,560px);margin:0 auto;aspect-ratio:112/176;max-height:calc(100vh - 300px)}
.trace-wrap svg{width:100%;height:100%;touch-action:none;display:block}
.bub-field{position:relative;flex:1;min-height:420px;border-radius:30px;overflow:hidden;touch-action:none;background:var(--glass-2);border:2px solid var(--glass-line)}
.bub{position:absolute;left:0;top:0;width:96px;height:96px;display:grid;place-items:center;font-weight:700;font-size:46px;color:var(--paper-ink);will-change:transform;touch-action:none}
.bub .face{position:absolute;inset:0;border-radius:50%}
.bub b{position:relative;z-index:1;font-family:var(--font-read)}
.skin-bucht .bub .face{background:radial-gradient(circle at 32% 28%,#fff 0 10%,rgba(255,255,255,.55) 16%,rgba(160,235,240,.35) 48%,rgba(80,190,205,.5) 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.8)}
.skin-eis .bub .face{background:radial-gradient(circle at 35% 30%,#fff 0 30%,#d9f0ff 70%,#9ccff3 100%);box-shadow:0 4px 14px rgba(40,100,160,.25);clip-path:polygon(50% 0,61% 20%,85% 15%,80% 39%,100% 50%,80% 61%,85% 85%,61% 80%,50% 100%,39% 80%,15% 85%,20% 61%,0 50%,20% 39%,15% 15%,39% 20%)}
.skin-garten .bub .face{background:radial-gradient(circle,#fff6b8 0 26%,#ffd0de 27% 62%,#ff9ab9 63%);border-radius:44% 56% 52% 48%/50% 44% 56% 50%;box-shadow:0 4px 14px rgba(200,60,110,.25)}
.skin-nacht .bub .face{background:radial-gradient(circle,#fff8d6 0 30%,#ffd76a 70%,#f2b134);clip-path:polygon(50% 0,63% 33%,98% 35%,70% 57%,80% 92%,50% 72%,20% 92%,30% 57%,2% 35%,37% 33%)}
.skin-nacht .bub b{font-size:36px;margin-top:8px}
.skin-zucker .bub .face{background:repeating-conic-gradient(#ffb3dd 0 15deg,#fff 15deg 30deg);box-shadow:inset 0 0 0 6px #fff,0 4px 14px rgba(160,40,140,.25)}
.skin-zucker .bub b{background:#fff;border-radius:50%;width:62px;height:62px;display:grid;place-items:center}
.skin-herbst .bub .face{background:linear-gradient(135deg,#ffcf6a,#e8742f 60%,#b8452a);border-radius:0 70% 0 70%;box-shadow:0 4px 14px rgba(120,50,20,.25)}
.bub.popped{transition:transform .2s,opacity .2s;opacity:0}
.bub.wob{animation:shake .4s}
.target-badge{display:flex;align-items:center;gap:14px;justify-content:center}
.target-badge .crys{min-width:96px;height:96px;padding:0 14px;display:grid;place-items:center;font-weight:700;font-size:54px;background:var(--paper);color:var(--paper-ink);clip-path:polygon(18% 0,82% 0,100% 30%,100% 70%,82% 100%,18% 100%,0 70%,0 30%)}

.mem-grid{display:grid;gap:14px;width:min(100%,860px);margin:0 auto;perspective:900px}
.mcard{position:relative;aspect-ratio:3/3.6;transform-style:preserve-3d;transition:transform .45s}
.mcard.open{transform:rotateY(180deg)}
.mcard .side{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;box-shadow:0 8px 18px var(--shade)}
.mcard .back{background:linear-gradient(145deg,var(--accent),var(--accent-2));color:#fff}
.mcard .back svg{width:56%;height:56%;opacity:.9}
.mcard .front{background:var(--paper);color:var(--paper-ink);transform:rotateY(180deg);font-weight:700;font-size:calc(46px * var(--fscale));text-align:center;padding:6px}
.mcard .front .emoji{font-size:58px}
.mcard .front .wtxt{font-size:calc(28px * var(--fscale))}
.mcard.done .front{box-shadow:0 0 0 5px var(--good),0 8px 18px var(--shade)}
.mcard.done{animation:pop .5s}

.houses{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.house{width:min(42vw,220px);height:170px;border-radius:24px 24px 18px 18px;background:var(--paper);color:var(--paper-ink);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:12px;position:relative;box-shadow:0 10px 24px var(--shade);font-weight:700;font-size:78px}
.house::before{content:"";position:absolute;top:-46px;left:12%;right:12%;height:50px;background:var(--roof);clip-path:polygon(50% 0,100% 100%,0 100%)}
.house small{font-size:15px;color:#6a7686;font-weight:400}
.house:active{transform:scale(.96)}
.fall{position:absolute;left:50%;top:0;transform:translateX(-50%);font-weight:700;font-size:96px;width:140px;height:140px;display:grid;place-items:center;background:var(--paper);color:var(--paper-ink);border-radius:30px;box-shadow:0 10px 24px var(--shade)}
.lettergrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px;width:min(100%,820px);margin:0 auto}
.lcell{height:100px;border-radius:22px;background:var(--paper);color:var(--paper-ink);font-weight:700;font-size:62px;display:grid;place-items:center;box-shadow:0 6px 16px var(--shade);position:relative}
.lcell.found{background:var(--good-2)}
.lcell svg.cover{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px)}

.pearl-wrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.pearl-canvas{width:100%;flex:1;min-height:300px;border-radius:26px;touch-action:none;background:var(--glass-2);border:2px solid var(--glass-line);display:block}
.dpad{display:grid;grid-template-columns:repeat(3,70px);grid-template-rows:repeat(2,62px);gap:8px;justify-content:center}
.dpad button{border-radius:20px;background:var(--paper);color:var(--accent);box-shadow:0 5px 0 rgba(0,0,0,.1);display:grid;place-items:center}
.dpad button svg{width:34px;height:34px}
.dpad button:active{transform:translateY(3px)}
.hud{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.slot{min-width:64px;height:76px;padding:0 10px;border-radius:18px;border:3px dashed var(--paper-line);background:var(--paper-2);color:var(--paper-ink);font-weight:700;font-size:calc(46px * var(--fscale));display:grid;place-items:center}
.slot.filled{border-style:solid;border-color:var(--good);background:var(--paper);animation:pop .35s}
.slot.next{border-color:var(--accent)}
.bank{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;max-width:860px;margin:0 auto}
.ltile{min-width:76px;height:84px;padding:0 14px;border-radius:20px;background:var(--paper);color:var(--paper-ink);font-weight:700;font-size:calc(46px * var(--fscale));box-shadow:0 6px 0 rgba(0,0,0,.1),0 10px 18px var(--shade);display:grid;place-items:center}
.ltile.used{visibility:hidden}
.ltile.no{animation:shake .4s;background:var(--warm-2)}
.ltile.hint{animation:glowpulse 1s infinite}
.clap{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--gold-2),var(--gold) 70%);color:#4a3300;font-weight:700;font-size:24px;box-shadow:0 10px 0 rgba(0,0,0,.12),0 16px 30px var(--shade);display:grid;place-items:center;text-align:center}
.clap:active{transform:translateY(6px) scale(.97);box-shadow:0 4px 0 rgba(0,0,0,.12)}
.clap svg{width:64px;height:64px}
.arcs{display:flex;justify-content:center;gap:4px;min-height:22px}
.arcs i{width:62px;height:22px;border-bottom:6px solid var(--accent);border-radius:0 0 60px 60px;animation:pop .3s}
.sylpiece{min-width:96px;height:84px;padding:0 18px;border-radius:22px;background:var(--paper);font-weight:700;font-size:calc(42px * var(--fscale));box-shadow:0 6px 0 rgba(0,0,0,.1),0 10px 18px var(--shade);display:grid;place-items:center;color:var(--paper-ink)}
.sylpiece.used{opacity:.25;pointer-events:none}
.sylpiece.no{animation:shake .4s;background:var(--warm-2)}

/* stories */
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.bookcard{position:relative;border-radius:10px 24px 24px 10px;background:var(--paper);color:var(--paper-ink);padding:18px 16px 16px 26px;min-height:190px;display:flex;flex-direction:column;gap:8px;text-align:left;box-shadow:inset 10px 0 0 var(--accent),0 10px 24px var(--shade)}
.bookcard .emoji{font-size:58px}
.bookcard b{font-size:20px;line-height:1.2}
.bookcard .lvl{display:flex;gap:3px}
.bookcard .lvl i{width:12px;height:12px;border-radius:3px;transform:rotate(45deg);background:var(--paper-line)}
.bookcard .lvl i.on{background:var(--accent)}
.bookcard.locked{opacity:.55}
.bookcard .badge{position:absolute;top:12px;right:12px;font-size:13px;font-weight:700;border-radius:99px;padding:2px 9px;background:var(--gold-2);color:#5a4100}
.reader{display:flex;flex-direction:column;gap:14px;align-items:center;max-width:980px;margin:0 auto;width:100%;flex:1}
.reader .pic{font-size:clamp(90px,17vmin,160px);min-height:1.1em;animation:float 3.4s ease-in-out infinite}
.reader .page{width:100%;min-height:180px;display:grid;place-items:center;padding:22px 18px}
.reader .tr{font-size:20px;color:#5d6875;text-align:center}
.navrow{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.choice{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}

/* castle */
.castle-view{position:relative;flex:1;min-height:420px;border-radius:28px;overflow:hidden;touch-action:none}
.castle-view svg.sc{position:absolute;inset:0;width:100%;height:100%}
.decor{position:absolute;font-size:54px;transform:translate(-50%,-50%);touch-action:none;line-height:1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.2))}
.decor.sel{outline:3px dashed var(--gold);outline-offset:6px;border-radius:12px}
.decor.anim{animation:pop .5s}
.decor.float{animation:float 3s ease-in-out infinite}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;max-height:46vh;overflow:auto;padding:4px}
.shopitem{border-radius:18px;background:var(--paper-2);padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--paper-ink)}
.shopitem .emoji{font-size:40px}
.shopitem small{font-size:13px;text-align:center;line-height:1.1}
.shopitem .pr{font-weight:700;font-size:15px;display:flex;align-items:center;gap:3px}
.shopitem .pr svg{width:16px;height:16px}
.shopitem.poor{opacity:.45}

/* letter card */
.lcard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:stretch;max-width:1000px;margin:0 auto;width:100%}
@media (max-width:760px){.lcard{grid-template-columns:1fr}}
.lpair{display:flex;align-items:baseline;justify-content:center;gap:.2em}
.lpair .lo{color:var(--accent)}
.actrow{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.act{min-height:76px;border-radius:22px;background:var(--paper);color:var(--paper-ink);font-weight:700;font-size:19px;display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:0 6px 0 rgba(0,0,0,.07),0 10px 20px var(--shade)}
.act svg{width:34px;height:34px;color:var(--accent);flex:none}
.act .arl{font-family:var(--font-ar);font-size:30px;color:var(--accent);width:34px;text-align:center}
.wchips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.wchip{display:flex;align-items:center;gap:8px;border-radius:999px;background:var(--paper);color:var(--paper-ink);padding:6px 16px 6px 8px;font-size:calc(26px * var(--fscale));font-weight:700;box-shadow:0 5px 14px var(--shade)}
.wchip .emoji{font-size:38px}
.story-txt{font-size:20px;line-height:1.5;text-align:center}
.lesson-stage{width:min(100%,520px);aspect-ratio:1.4;margin:0 auto}
.lesson-stage svg{width:100%;height:100%}

/* parent area */
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:330px;margin:0 auto;width:100%}
.keypad button{height:64px;border-radius:18px;background:var(--paper-2);font-weight:700;font-size:26px;color:var(--paper-ink)}
.keypad .ok{background:var(--accent);color:var(--accent-ink)}
.gate-show{font-size:34px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.gate-show.no{animation:shake .4s}
.psec{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:22px;background:var(--paper-2)}
.psec h3{margin:0;font-size:20px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.psec h3 .ar{font-size:17px;font-weight:400;color:#6a7686}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:16px}
.field input[type=text],.field select{min-height:50px;border-radius:14px;border:2px solid var(--paper-line);padding:0 14px;background:#fff;color:var(--paper-ink);font-size:18px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:52px}
.toggle .sw{width:62px;height:36px;border-radius:99px;background:#c9d2db;position:relative;flex:none;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .2s}
.toggle[aria-checked="true"] .sw{background:var(--good)}
.toggle[aria-checked="true"] .sw::after{transform:translateX(26px)}
.tlabel{display:flex;flex-direction:column;text-align:left}
.tlabel small{color:#6a7686;font-size:14px}
.stat-table{width:100%;border-collapse:collapse;font-size:16px}
.stat-table td,.stat-table th{padding:6px 8px;border-bottom:1px solid var(--paper-line);text-align:left;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:99px;background:var(--paper-line);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--good)}
.linklist{display:flex;flex-direction:column;gap:10px}
.linklist a{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:16px;background:#fff;color:var(--paper-ink);text-decoration:none;box-shadow:0 3px 10px var(--shade)}
.linklist a b{color:var(--accent);font-size:18px}
.linklist a span{font-size:15px;color:#55606c}
.ai-out{white-space:pre-wrap;font-size:15px;color:#55606c;min-height:22px}
.note{font-size:15px;color:#55606c;line-height:1.45}
.crysgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px;max-width:900px;margin:0 auto;width:100%}
.crys{position:relative;height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--paper-ink)}
.crys svg{position:absolute;inset:0;width:100%;height:100%}
.crys b{position:relative;font-size:40px;line-height:1}
.crys small{position:relative;font-size:13px;font-weight:700}
.end-stars{display:flex;justify-content:center;gap:10px}
.end-stars svg{width:84px;height:84px;opacity:.2;transform:scale(.6);transition:transform .45s cubic-bezier(.3,1.6,.5,1),opacity .3s}
.end-stars svg.on{opacity:1;transform:scale(1)}
.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.diff{border-radius:22px;background:var(--paper-2);padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;color:var(--paper-ink);box-shadow:0 5px 0 rgba(0,0,0,.06)}
.diff svg{width:auto;height:54px}
.diff.rec{box-shadow:0 0 0 4px var(--gold),0 5px 0 rgba(0,0,0,.06)}
.gamehelp{display:flex;gap:12px;align-items:flex-start;background:var(--paper-2);border-radius:18px;padding:12px 14px}
.gamehelp .ar{color:#55606c;font-size:16px}
.fw-canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.fw-bar{position:absolute;left:0;right:0;bottom:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:0 90px 0 90px;z-index:2}
.fw-bar button{width:62px;height:62px;border-radius:18px;background:rgba(255,255,255,.18);color:#fff;font-weight:700;font-size:34px;border:2px solid rgba(255,255,255,.4)}
.fw-bar button.on{background:#ffcf5a;color:#2b1d00}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* =================== additions: frame, scene, start, home =================== */
input,textarea,select{-webkit-user-select:text;user-select:text}
input.bad{border-color:var(--warm)!important}
#defs{position:absolute;width:0;height:0;overflow:hidden}
#stage.fixed{padding-bottom:14px}
.screen.game{height:100%;min-height:0;gap:12px}
.play{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;width:100%}
.center-txt{text-align:center}
.shake{animation:shake .45s}
.hl{background:var(--gold-2);border-radius:.18em;box-shadow:0 0 0 .06em var(--gold-2)}
.sh-ico{width:46px;height:46px;display:grid;place-items:center;color:var(--accent);flex:none}
.sh-ico svg{width:100%;height:100%}
.sheet{position:relative}
.sheet.wide{width:min(880px,100%)}
.small-ar{font-size:16px;font-weight:400}
.row.left{justify-content:flex-start}
.btn.danger{color:#b4332a}
.ls{display:inline-flex}.ls svg{width:16px;height:16px}

:root{--tree:#6fa7c9;--tree2:#8cbcd8;--trunk:#7d6352;--sea:#5fc8d6}
:root[data-world="garten"]{--tree:#47a457;--tree2:#62bd70;--trunk:#8a5a3a}
:root[data-world="nacht"]{--tree:#0e1336;--tree2:#171d4a;--trunk:#0b0f2c}
:root[data-world="bucht"]{--tree:#2fa57a;--tree2:#45bd8f;--trunk:#a77b52}
:root[data-world="zucker"]{--tree:#ff8cc8;--tree2:#b9a2ff;--trunk:#ffffff}
:root[data-world="herbst"]{--tree:#d9682c;--tree2:#efa043;--trunk:#7a4a2c}
#scene .sun{position:absolute;right:8%;top:6%;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#fffdf0 0 36%,#ffe78f 56%,rgba(255,231,143,0) 71%);animation:breathe 7s ease-in-out infinite}
:root[data-world="nacht"] #scene .sun{width:84px;height:84px;background:transparent;box-shadow:inset 22px -8px 0 0 #fff3c4;filter:drop-shadow(0 0 18px rgba(255,240,190,.55));animation:none;transform:rotate(-20deg)}
:root[data-world="herbst"] #scene .sun{background:radial-gradient(circle,#fff6e0 0 34%,#ffc46b 56%,rgba(255,196,107,0) 71%)}
#scene .cloud{position:absolute;left:0;width:200px;height:80px;opacity:.85;animation:drift linear infinite;pointer-events:none}
#scene .cloud svg{position:static;width:100%;height:100%}
#scene .cloud.c1{top:9%;animation-duration:150s;animation-delay:-40s}
#scene .cloud.c2{top:21%;width:150px;height:60px;animation-duration:115s;animation-delay:-85s;opacity:.7}
#scene .cloud.c3{top:3%;width:120px;height:48px;animation-duration:180s;animation-delay:-130s;opacity:.6}
:root[data-world="nacht"] #scene .cloud{opacity:.1}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(calc(100vw + 60px))}}
.far{fill:var(--far)} .cap{fill:#fff;opacity:.85}
:root[data-world="nacht"] .cap{fill:#cfcaf5;opacity:.3}
.hl1{fill:var(--hill1)} .hl2{fill:var(--hill2)}
.cs{fill:var(--castle)} .csh{fill:var(--castle-sh)} .rf{fill:var(--roof)} .rfs{fill:var(--roof-sh)}
.win{fill:var(--win)} .win.tw{animation:twinkle 5s ease-in-out infinite}
.flg{fill:var(--flag);transform-box:fill-box;transform-origin:0 50%;animation:wave 2.6s ease-in-out infinite}
.pole{stroke:#7a6a5c;stroke-width:3;fill:none}
.road{fill:var(--castle-sh);opacity:.55}
.snowcap{fill:#fff}
.tree{fill:var(--tree)} .tree2{fill:var(--tree2)} .trunk{fill:var(--trunk)}
.sea{fill:var(--sea);opacity:.92}
.sea-move{animation:seamove 7s linear infinite}
@keyframes seamove{from{transform:translateX(0)}to{transform:translateX(80px)}}
.w-eis,.w-garten,.w-nacht,.w-bucht,.w-zucker,.w-herbst{display:none}
:root[data-world="eis"] .w-eis,:root[data-world="garten"] .w-garten,:root[data-world="nacht"] .w-nacht,:root[data-world="bucht"] .w-bucht,:root[data-world="zucker"] .w-zucker,:root[data-world="herbst"] .w-herbst{display:inline}

/* start */
.on-start #nur{opacity:.9}
.start{justify-content:center;align-items:center;text-align:center;gap:22px;padding-block:10px}
.start-title{display:flex;flex-direction:column;align-items:center;gap:6px}
.wordmark.big{font-size:clamp(40px,8.5vw,92px);line-height:1.05;white-space:normal;text-shadow:0 2px 0 var(--glass-line),0 0 34px rgba(255,255,255,.85)}
:root[data-world="nacht"] .wordmark.big{text-shadow:0 0 24px rgba(255,214,110,.55)}
.start-sub{font-size:21px;font-weight:700;color:var(--ink-soft)}
.start-sub.ar{font-size:19px}
.start-who{margin:0;font-size:22px;font-weight:700;color:var(--ink)}
.profiles{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.pbtn{width:178px;min-height:200px;justify-content:center}
.pbtn .pico{width:110px;height:96px;border-radius:20px;overflow:hidden;display:grid;place-items:center;box-shadow:0 4px 12px var(--shade)}
.pbtn .pico svg{width:100%;height:100%}
.pbtn .pico.plus{background:linear-gradient(140deg,var(--gold-2),var(--gold));color:#5a3d00;box-shadow:none}
.pbtn .pico.plus svg{width:54px;height:54px}
.pbtn .nm{font-size:22px}
.pstars{display:flex;align-items:center;gap:4px;font-weight:700;color:#6b5a2a}
.pstars svg{width:20px;height:20px}

/* home */
.hello{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.hello .h1{text-shadow:0 0 22px var(--glass-line)}
.tile.daily .ico{width:96px;height:96px}
.dgift{display:grid;place-items:center;width:92px;height:92px;border-radius:50%;background:linear-gradient(140deg,#ffe596,#e3a01c);color:#fff;animation:float 3s ease-in-out infinite}
.dgift svg{width:56px;height:56px}
.dsteps{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.dstep{display:flex;align-items:center;gap:6px;border-radius:99px;padding:4px 12px 4px 4px;background:rgba(255,255,255,.7);font-size:15px;color:var(--paper-ink)}
.dstep i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;background:var(--paper-line);font-size:14px}
.dstep i svg{width:18px;height:18px}
.dstep.done i{background:var(--good);color:#fff}
.dstep.now{box-shadow:0 0 0 3px var(--gold)}
.tile .nm-ar{font-size:15px}
.unlock-ico{width:150px;height:150px;animation:float 3s ease-in-out infinite}
.unlock-ico svg{width:100%;height:100%}
.lesson-badge{font-weight:700;font-size:64px;letter-spacing:.1em;color:var(--accent)}
.giftbox{width:170px;height:170px;border-radius:40px;background:linear-gradient(140deg,#ffe596,#e3a01c);color:#fff;display:grid;place-items:center;box-shadow:0 14px 30px var(--shade);animation:float 2.6s ease-in-out infinite}
.giftbox svg{width:110px;height:110px}
.giftbox.open{animation:pop .6s;background:linear-gradient(140deg,#fff6c9,#ffd25a)}
.break-ico{width:90px;height:90px;color:var(--good)}
.break-ico svg{width:100%;height:100%}
.break-ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:32px;border:6px solid var(--gold-2);font-variant-numeric:tabular-nums}
.endscreen{gap:18px;justify-content:center;align-items:center;text-align:center}
.endgain{display:flex;align-items:center;gap:6px;font-weight:700;font-size:28px;color:var(--ink)}
.mini-star svg{width:34px;height:34px}
.sylsample{font-weight:700;font-size:22px}
.swatch{display:inline-block;min-width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.8);margin-right:2px;vertical-align:middle;font-size:0}
.pill .swatch{font-size:0}
.penswatch{font-weight:700}
.pen-rainbow{background:linear-gradient(90deg,#ff5f8f,#ffb347,#e8c400,#3fbf5a,#3f9fe0,#8a5cf0);-webkit-background-clip:text;background-clip:text;color:transparent}
.pen-gold{color:#c98a0e}.pen-ice{color:#2f8fd6}.pen-rose{color:#d63a76}.pen-stars{color:#e39a14}
.pill.on .penswatch{color:var(--accent-ink);background:none;-webkit-background-clip:border-box;background-clip:border-box}
.tablewrap{overflow-x:auto}
.ai-item{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:8px 10px}
.ai-item .emoji{font-size:30px}
.ai-item b{flex:1;min-width:0}
.parent .psec{max-width:860px;width:100%;margin:0 auto}

/* garden & letter card */
.garden-head{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.lgarden{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
.lflower{position:relative;min-height:112px;border-radius:24px;background:var(--paper);color:var(--paper-ink);box-shadow:0 6px 0 rgba(0,0,0,.06),0 10px 20px var(--shade);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;transition:transform .12s}
.lflower:active{transform:scale(.94)}
.lfp{font-weight:700;font-size:44px;line-height:1;display:flex;gap:.12em;align-items:baseline}
.lfp .lo{color:var(--accent)}
.lfc svg{width:66px;height:20px;display:block}
.lflower.lv3{background:linear-gradient(160deg,#fffbe8,var(--paper) 60%);box-shadow:0 0 0 3px var(--gold-2),0 10px 20px var(--shade)}
.team-flower .word{font-size:40px}
.lbig{display:grid;place-items:center;min-height:clamp(190px,32vh,320px);cursor:pointer}
.lbig.wiggle{animation:pop .5s}
.lbig .bigletter{font-size:clamp(96px,21vmin,210px)}
.teambig .word{font-size:clamp(80px,16vmin,150px)}
.whyhead{display:flex;gap:14px;align-items:center}
.whypic{font-size:64px;flex:none}
.whybox .story-txt{text-align:left;margin:0}
.confchip{font-size:24px}
.confchip .mini svg{width:22px;height:22px;color:var(--gold)}
.act{text-align:left}
.hint-team-on .team{position:relative;border-radius:.42em;padding:0 .08em;margin:0 .02em;box-shadow:inset 0 0 0 .07em currentColor;display:inline-block}
.hint-team-on .team.t-ei,.hint-team-on .team.t-ai{border-radius:50%/58%;background:rgba(242,177,52,.22);box-shadow:inset 0 0 0 .07em #e2a21c;padding:0 .16em}
.hint-team-on .team.t-ie,.hint-team-on .team.t-ee,.hint-team-on .team.t-aa,.hint-team-on .team.t-oo{background:rgba(214,58,118,.10);padding:0 .24em 0 .1em;border-radius:.6em}
.hint-team-on .team .fade{opacity:.42}
.hint-team-on .team.t-sch{background:rgba(120,70,200,.12)}
.hint-team-on .team.t-ch{background:rgba(16,150,160,.12)}
.hint-team-on .team.t-au{background:rgba(230,120,30,.13)}
.hint-team-on .team.t-eu,.hint-team-on .team.t-äu{background:rgba(40,110,220,.12)}
.hint-team-on .team.t-ck,.hint-team-on .team.t-tz,.hint-team-on .team.t-pf,.hint-team-on .team.t-qu,.hint-team-on .team.t-sp,.hint-team-on .team.t-st{box-shadow:inset 0 0 0 .06em rgba(0,0,0,.28);border-radius:.3em}

/* tracing */
.trace-top{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.trace-label{font-weight:700;font-size:40px;display:flex;gap:.3em;padding:0 8px;color:var(--ink-soft);opacity:.85}
.trace-label .on{color:var(--ink);opacity:1}
.casebtn{min-height:48px}
.trace-area{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.trace-card{padding:0;overflow:hidden;border-radius:26px}
.trace-svg{width:100%;height:100%;display:block;touch-action:none}
.tband{fill:var(--accent-2);opacity:.12}
.tline{stroke:#9fb3c6;stroke-width:.7;stroke-dasharray:2.5 2.5;fill:none}
.tline.mid{stroke:#7f99b2}
.tline.base{stroke:#d6475a;stroke-width:1.1;stroke-dasharray:none;opacity:.7}
.tg{fill:none;stroke:#e6eef5;stroke-width:15;stroke-linecap:round;stroke-linejoin:round}
.tgc{fill:none;stroke:#b5c6d5;stroke-width:1.3;stroke-dasharray:3 3;stroke-linecap:round}
.tg-dot{fill:#e6eef5}
.inkp{fill:none;stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
.inkp.ghost,.inkd.ghost{opacity:.45}
.mk circle{fill:#9fb3c6} .mk text{fill:#fff;font:700 7.5px Andika,sans-serif}
.mk:not(.cur){opacity:.75}
.mk.cur circle{fill:var(--good);transform-box:fill-box;transform-origin:center;animation:mkpulse 1.4s ease-in-out infinite}
.mk.pulse circle{animation:mkbig .45s ease-in-out 3}
.tarrow{fill:var(--good)}
.finger{fill:#fff;stroke:var(--gold);stroke-width:2;opacity:.95}
.trace-svg.done .inkp{animation:inkglow 1.1s ease-in-out 2}
@keyframes mkpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@keyframes mkbig{0%,100%{transform:scale(1)}50%{transform:scale(1.9)}}
@keyframes inkglow{50%{stroke-width:14}}
.glowbtn{animation:glowpulse 1.2s infinite}

/* bubbles, castle */
.bub-head{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.bub-field{min-height:240px}
.castle-view{min-height:260px;background:linear-gradient(180deg,var(--sky1),var(--sky2) 72%,var(--sky3))}
.cv-sun{position:absolute;right:7%;top:7%;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,#fffdf0 0 36%,#ffe78f 56%,rgba(255,231,143,0) 71%)}
:root[data-world="nacht"] .cv-sun{background:transparent;box-shadow:inset 18px -6px 0 0 #fff3c4;width:66px;height:66px}
.castle-tools{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.seltools{display:flex;gap:8px;padding:4px 8px;border-radius:99px;background:var(--glass)}
.decor{cursor:grab;user-select:none}
.picbtn{display:grid;place-items:center;border-radius:28px;padding:2px 10px}
.emoji.mid{font-size:clamp(60px,11vmin,104px)}
.emoji.hudpic{font-size:46px}
.reveal{min-height:1.25em;font-size:calc(40px * var(--fscale));font-weight:700;color:var(--ink)}
.reveal .emoji{font-size:1.6em}

/* memory, fireworks, crystals */
.mem-area{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.mem-grid{width:auto}
.mcard{width:var(--cw,120px)}
.mletter{font-size:calc(var(--cw,120px) * .5)}
.mcard .front .emoji{font-size:calc(var(--cw,120px) * .46)}
.mcard .front .wtxt{font-size:calc(var(--cw,120px) * .21)}
.fw-box{position:relative;flex:1;min-height:0;border-radius:28px;overflow:hidden;background:radial-gradient(ellipse at 50% 120%,#3b2f7a 0%,#141641 55%,#070821 100%)}
.fw-bar{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding:4px 16px 4px 96px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.fw-bar::-webkit-scrollbar{display:none}
.fw-bar button{flex:none}
.fw-bar .fw-name{width:auto;padding:0 16px;font-size:22px}
.fw-hint{position:absolute;top:38%;left:0;right:0;text-align:center;color:#fff;font-weight:700;font-size:28px;opacity:.85;pointer-events:none;animation:float 3s ease-in-out infinite}
.crys.lv0 b{opacity:.55}
.crys.lv3{animation:twinkle 3s ease-in-out infinite}
.ranks{display:flex;flex-direction:column;gap:8px;max-width:640px;margin:0 auto;width:100%}
.rankrow{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:18px;background:var(--glass);color:var(--ink)}
.rankrow.got{background:var(--paper);color:var(--paper-ink)}
.rankrow.now{box-shadow:0 0 0 4px var(--gold)}
.rankrow > span:first-child svg{width:26px;height:26px;color:var(--gold)}
.rk-need{margin-left:auto;display:flex;align-items:center;gap:4px;font-weight:700}

/* b-d, pearls, syllables, sounds, words, teams */
.houses{margin-top:48px}
.house{font-size:inherit;justify-content:center;gap:2px;padding:8px 6px;height:auto;min-height:150px}
.hletter{font-size:74px;font-weight:700;line-height:1}
.hemoji{font-size:34px}
.fall-wrap{position:relative;width:100%;height:150px;flex:none}
.fall{animation:falldown .6s ease-out}
.fall.land{animation:pop .4s}
@keyframes falldown{from{transform:translate(-50%,-40px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.opts.two{grid-template-columns:repeat(2,minmax(130px,280px));justify-content:center}
.opts.small3{grid-template-columns:repeat(3,minmax(90px,140px));justify-content:center}
.bdgrid{grid-template-columns:repeat(6,1fr);max-width:720px}
@media (max-width:600px){.bdgrid{grid-template-columns:repeat(4,1fr)}}
.bdgrid .lcell{height:88px;font-size:56px}
.lcell.no{animation:shake .4s;background:var(--warm-2)}
.pearl-wrap{width:100%}
.pearl-canvas{min-height:220px}
.hud .slots .slot{min-width:52px;height:62px;font-size:36px}
.nosyl .syl{color:inherit!important}
.nosyl .team{background:none!important;box-shadow:none!important}
.clap.pressed{animation:pop .25s}
.s1c{color:var(--s1)} .s2c{color:var(--s2)}
.soundbtn{position:relative;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,var(--accent-2));color:var(--accent);display:grid;place-items:center;box-shadow:0 12px 30px var(--shade)}
.soundbtn svg{width:76px;height:76px}
.soundbtn.ringing{animation:pop .5s}
.wdone .slot{animation:pop .4s}
.model{font-size:calc(34px * var(--fscale));opacity:.55}
.gapline{display:flex;align-items:center;justify-content:center;gap:2px}
.gapslot{min-width:84px;height:72px}
.teamopts .opt{font-size:calc(46px * var(--fscale))}
.boltbar{width:min(100%,520px);height:12px;border-radius:99px;background:var(--glass-2);overflow:hidden;margin:0 auto;border:1px solid var(--glass-line)}
.boltbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2))}
.boltbar.run i{animation:boltrun 5s linear forwards}
@keyframes boltrun{to{width:0}}
.sightw{font-size:calc(40px * var(--fscale))}
.blitzico svg{width:80px;height:80px}
.qline.small{font-size:20px}
.opt.tf{flex-direction:row;font-size:calc(30px * var(--fscale));gap:10px;min-height:96px}
.opt.tf svg{width:40px;height:40px}
.opt.yes{color:var(--good)} .opt.no-btn{color:var(--warm)}
.play .page{width:min(100%,920px);padding:16px 20px}
.nowyou{animation:pop .5s}
.reader-screen .reader{justify-content:center}
.pageno{font-size:15px;color:var(--ink-soft);font-weight:700}
.choicebtn{min-width:180px}
.otxt{font-size:calc(24px * var(--fscale))}
.bigbook svg{width:150px;height:150px;animation:float 3s ease-in-out infinite}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modebtn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 12px;border-radius:24px;background:var(--paper-2);color:var(--paper-ink);font-size:20px}
.modebtn svg{width:56px;height:56px;color:var(--accent)}
.bookcard .badge.lockb{display:flex;align-items:center;gap:3px}
.bookcard .badge.lockb svg{width:14px;height:14px}

/* lessons */
.lesson-stage{width:min(100%,560px);aspect-ratio:1.5;margin:0 auto;background:var(--paper-2);border-radius:24px}
.lg path{fill:none;stroke:currentColor;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
.lg circle{fill:currentColor}
.ink1{color:var(--accent)} .ink2{color:#8a96a3} .ink3{color:#e3a01c}
.draw path{stroke-dasharray:520;stroke-dashoffset:520;animation:drawit 1.6s ease forwards}
.draw .s1{animation-delay:.8s} .draw .s2{animation-delay:1.6s}
@keyframes drawit{to{stroke-dashoffset:0}}
.dropTop .s1{animation:vanish 1.2s .8s ease forwards}
@keyframes vanish{to{opacity:.07}}
.appear{opacity:0;animation:fadein .8s 1.8s forwards}
.larrow{fill:none;stroke:var(--ink-soft);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.lg.pulse{animation:twinkle 1s ease-in-out infinite}
.lg-stick{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round;transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:growy 1s .9s ease forwards}
@keyframes growy{to{transform:scaleY(1)}}
.lcardbg{fill:var(--paper)}
.ltxt{font:700 20px Andika,sans-serif;fill:var(--paper-ink);text-anchor:middle}
.eggframe{fill:rgba(242,177,52,.18);stroke:#e2a21c;stroke-width:5}
.tiltL,.tiltR{transform-box:fill-box;transform-origin:50% 100%}
.tiltL{animation:tiltl 1.2s ease .3s both} .tiltR{animation:tiltr 1.2s ease .3s both}
@keyframes tiltl{40%{transform:rotate(-14deg)}100%{transform:rotate(0)}}
@keyframes tiltr{40%{transform:rotate(14deg)}100%{transform:rotate(0)}}
.bigtxt{font:700 34px Andika,sans-serif;fill:#e3a01c;text-anchor:middle}
.popin{transform-box:fill-box;transform-origin:center;animation:popin .5s .9s both}
@keyframes popin{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.emoji-t{font-size:30px;text-anchor:middle}
.longframe{fill:rgba(214,58,118,.08);stroke:#d63a76;stroke-width:4}
.stretch{transform-box:fill-box;transform-origin:0 50%;animation:stretchx 1.6s ease .4s both}
@keyframes stretchx{50%{transform:scaleX(1.5)}100%{transform:scaleX(1)}}
.faded{opacity:.35}
.longline{stroke:#d63a76;stroke-width:5;stroke-linecap:round;fill:none;transform-box:fill-box;transform-origin:0 50%;animation:growx 1.4s .5s ease both}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.midtxt{font:700 28px Andika,sans-serif;fill:var(--paper-ink);text-anchor:middle}
.mount{fill:var(--accent-2);opacity:.35}
.flipper{transform-box:fill-box;transform-origin:50% 50%;animation:flip180 1.6s 1s ease-in-out forwards}
@keyframes flip180{to{transform:rotate(180deg)}}
@media (max-height:700px){#bar{min-height:58px;padding-block:6px}.rbtn{width:44px;height:44px}.starpill{height:42px}.opt{min-height:92px}.opt .emoji{font-size:52px}.prompt .emoji.big{font-size:clamp(70px,14vmin,130px)}}
.sheet .dots i{background:var(--paper-line);border-color:var(--paper-line)}
.sheet .dots i.done{background:var(--gold);border-color:var(--gold)}
.sheet .dots i.now{background:var(--paper);border-color:var(--accent)}
#app.ingame #fx{opacity:.55}
.pearl-canvas{background:var(--glass)}
.unlock-list{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.unlock-item{display:flex;flex-direction:column;align-items:center;gap:4px;width:150px;padding:8px;border-radius:22px;background:var(--paper-2);color:var(--paper-ink)}
.unlock-item .unlock-ico{width:110px;height:110px}
.unlock-item b{font-size:18px;text-align:center;line-height:1.15}
#app{grid-template-columns:minmax(0,1fr)}
#bar > *{min-width:0}

.wordmark{overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){#bar .wordmark{display:none}#bar{gap:6px}.bar-title{font-size:18px}}
.screen{min-width:0}
/* text on paper surfaces always uses the paper ink (matters in the dark night world) */
.sheet .h2,.sheet h2,.paper .h2,.psec,.paper .reveal,.sheet .qline{color:var(--paper-ink)}
.sheet .muted,.paper .muted,.psec .muted{color:#5d6875}
.sheet .sub,.paper .sub{color:#4d5966}

/* ======================= realistic castle world (wide, pannable) ======================= */
.castle-screen{gap:10px}
.cw-wrap{position:relative;flex:1;min-height:300px;border-radius:26px;overflow:hidden;box-shadow:0 10px 30px var(--shade);isolation:isolate;background:#bfe0f7}
.cw-sky{position:absolute;inset:0;z-index:0;overflow:hidden}
.cw-sun{position:absolute;right:10%;top:5%;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#fffef7 0 22%,rgba(255,247,205,.9) 30%,rgba(255,238,170,.35) 48%,rgba(255,236,160,0) 70%)}
.cw-moon{display:none;position:absolute;right:12%;top:7%;width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 0 18px rgba(255,250,220,.55))}
.cw-moon.css{border-radius:50%;background:radial-gradient(circle at 40% 38%,#fffdf0,#e9e2c6 60%,#cfc6a6)}
.cw-stars{display:none;position:absolute;left:0;right:0;top:0;height:56%;background-image:radial-gradient(1.6px 1.6px at 8% 22%,#fff,transparent 70%),radial-gradient(1.2px 1.2px at 17% 9%,#fff,transparent 70%),radial-gradient(1.8px 1.8px at 26% 34%,#fff8d8,transparent 70%),radial-gradient(1.2px 1.2px at 35% 14%,#fff,transparent 70%),radial-gradient(1.5px 1.5px at 44% 27%,#fff,transparent 70%),radial-gradient(1.1px 1.1px at 52% 8%,#fff,transparent 70%),radial-gradient(1.7px 1.7px at 61% 31%,#fff8d8,transparent 70%),radial-gradient(1.2px 1.2px at 69% 16%,#fff,transparent 70%),radial-gradient(1.4px 1.4px at 78% 38%,#fff,transparent 70%),radial-gradient(1.2px 1.2px at 92% 24%,#fff,transparent 70%),radial-gradient(1px 1px at 4% 44%,#fff,transparent 70%),radial-gradient(1px 1px at 31% 47%,#fff,transparent 70%),radial-gradient(1px 1px at 57% 45%,#fff,transparent 70%),radial-gradient(1px 1px at 84% 50%,#fff,transparent 70%);background-size:520px 100%;animation:twinkle 4s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.75}to{opacity:1}}
.cw-clouds{position:absolute;inset:0;will-change:transform}
.cw-cloud{position:absolute;pointer-events:none;opacity:.95;will-change:transform;max-width:none}
.cw-cloud.c1{top:4%;left:4%;width:min(340px,40%);animation:cdrift 70s ease-in-out infinite alternate}
.cw-cloud.c2{top:13%;left:46%;width:min(260px,30%);opacity:.85;animation:cdrift 90s ease-in-out infinite alternate-reverse}
.cw-cloud.c3{top:2%;left:78%;width:min(220px,26%);opacity:.8;animation:cdrift 80s ease-in-out infinite alternate}
@keyframes cdrift{from{transform:translateX(-60px)}to{transform:translateX(80px)}}
.cw-wrap.night .cw-sun,.cw-wrap.night .cw-cloud{display:none}
.cw-wrap.night .cw-moon,.cw-wrap.night .cw-stars{display:block}
.cw{position:absolute;inset:0;z-index:1;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-x;scrollbar-width:none;overscroll-behavior-x:contain}
.cw::-webkit-scrollbar{display:none}
.cw-world{position:relative;height:100%;overflow:hidden}
.cw-mtn{position:absolute;left:0;bottom:49.6%;height:30%;background-repeat:repeat-x;background-size:auto 100%;background-position:left bottom;will-change:transform;opacity:.93}
.cw-forest{position:absolute;left:0;right:0;bottom:49.4%;height:10%;background-repeat:repeat-x;background-size:auto 100%;background-position:left bottom}
.cw-sea{display:none;position:absolute;left:0;right:0;bottom:49.5%;height:9%;background-repeat:repeat-x;background-size:auto 100%;background-position:left bottom}
.cw-wrap.seaw .cw-sea{display:block}
.cw-ground{position:absolute;left:0;right:0;top:50%;bottom:0;overflow:hidden;perspective:640px;perspective-origin:50% 0;background:#8fbf6a}
.cw-plane{position:absolute;left:-120%;right:-120%;top:0;height:300%;background-repeat:repeat;background-size:190px 190px;transform-origin:50% 0;transform:rotateX(64deg)}
.cw-ground::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(225,238,250,.62) 0,rgba(225,238,250,.18) 9%,rgba(255,255,255,0) 22%,rgba(0,0,0,0) 72%,rgba(0,0,0,.14))}
.cw-shade{display:none;position:absolute;inset:0;pointer-events:none;z-index:5}
.cw-wrap.night .cw-shade{display:block;background:linear-gradient(180deg,rgba(10,14,52,.6),rgba(6,10,40,.66))}
.cw-wrap.night .cw-ground::after{background:linear-gradient(180deg,rgba(40,50,110,.5),rgba(0,0,0,0) 30%)}
.cw-wrap.tint .cw-shade{display:block;background:rgba(255,120,190,.16);mix-blend-mode:color}
.cw-castle{position:absolute;transform:translate(-50%,-100%);pointer-events:none}
.cw-castle-img,.cw-castle-svg{display:block;height:100%;width:auto;max-width:none}
.cw-castle-sh{position:absolute;left:50%;bottom:-6%;width:118%;height:20%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.42),rgba(0,0,0,.18) 45%,rgba(0,0,0,0) 72%)}
.cw-castle-base{position:absolute;left:50%;bottom:-5%;width:112%;height:12%;transform:translateX(-50%);background-size:120px 120px;background-repeat:repeat;-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 60%,#000 35%,rgba(0,0,0,.55) 55%,transparent 75%);mask-image:radial-gradient(ellipse 50% 50% at 50% 60%,#000 35%,rgba(0,0,0,.55) 55%,transparent 75%);filter:brightness(.9)}
.cw-castle-base::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,0) 60%)}
.cw-wrap.night .cw-castle{filter:brightness(.6) saturate(.85)}
.dk{position:absolute;transform:translate(-50%,-100%);transform-origin:50% 100%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;line-height:1}
.dk.sky{transform:translate(-50%,-50%);transform-origin:50% 50%}
.dk .ph{display:block;height:100%;width:auto;max-width:none;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.22));transition:filter .2s}
.dk .ph-emo{display:flex;align-items:flex-end;justify-content:center;height:100%}
.dk-sh{position:absolute;left:50%;bottom:-5%;width:90%;height:15%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.36),rgba(0,0,0,0) 70%);pointer-events:none}
.dk.sel .ph{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 9px var(--gold)) drop-shadow(0 0 20px rgba(255,214,100,.75))}
.dk.drag{cursor:grabbing}
.dk.drag .ph{filter:drop-shadow(0 16px 12px rgba(0,0,0,.3)) drop-shadow(0 0 8px var(--gold))}
.dk.anim{animation:dkpop .55s}
.dk.sky.anim{animation:dkpops .55s}
@keyframes dkpop{0%,100%{transform:translate(-50%,-100%) scale(1)}35%{transform:translate(-50%,-100%) scale(1.12,.9)}70%{transform:translate(-50%,-100%) scale(.96,1.05)}}
@keyframes dkpops{0%,100%{transform:translate(-50%,-50%) scale(1)}40%{transform:translate(-50%,-50%) scale(1.14)}}
.dk.float .ph{animation:dkfloat 3.6s ease-in-out infinite}
@keyframes dkfloat{0%,100%{translate:0 0}50%{translate:0 -9%}}
.dk-halo{position:absolute;left:50%;width:170%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,226,150,.85),rgba(255,206,110,.32) 36%,rgba(255,200,100,0) 68%);opacity:0;pointer-events:none;mix-blend-mode:screen;transition:opacity .5s}
.dk-halo.fire{background:radial-gradient(circle,rgba(255,190,90,.9),rgba(255,140,40,.35) 38%,rgba(255,120,40,0) 68%)}
.cw-wrap.night .dk-halo,.dk.lit .dk-halo{opacity:1;animation:flick 2.4s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:.92}45%{opacity:.75}60%{opacity:1}}
.cw-wrap.night .dk:not(.glow) .ph{filter:brightness(.62) saturate(.82) drop-shadow(0 3px 4px rgba(0,0,0,.3))}
.cw-wrap.night .dk.sel:not(.glow) .ph{filter:brightness(.8) drop-shadow(0 0 9px var(--gold))}
.cw-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:6;width:56px;height:56px;border-radius:50%;background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1.5px solid var(--glass-line);color:var(--ink);display:grid;place-items:center;box-shadow:0 6px 16px var(--shade);transition:opacity .3s}
.cw-arrow svg{width:30px;height:30px}
.cw-arrow.l{left:12px}.cw-arrow.r{right:12px}
.cw-arrow.off{opacity:0;pointer-events:none}
.cw-mini{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:6;width:min(240px,48%);height:24px;border-radius:99px;background:rgba(255,255,255,.5);border:1.5px solid rgba(255,255,255,.85);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 4px 12px rgba(0,0,0,.16);cursor:pointer}
.cw-mini .win{position:absolute;top:2px;bottom:2px;border-radius:99px;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 2px var(--accent)}
.cw-mini b{position:absolute;top:50%;width:18px;height:18px;transform:translate(-50%,-55%);color:var(--accent);z-index:1}
.cw-mini b svg{width:18px;height:18px;display:block}
.sheet.wide{width:min(960px,96vw);max-width:96vw}
.shop-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.shop-tabs::-webkit-scrollbar{display:none}
.shop-tabs .pill{flex:none}
.sheet .shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:12px;max-height:52vh;overflow:auto;padding:4px}
.shopcard,.castlecard{position:relative;border-radius:20px;background:linear-gradient(180deg,#ffffff,#eef2f6);border:1px solid var(--paper-line);padding:10px 8px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--paper-ink);box-shadow:0 3px 10px rgba(0,0,0,.07)}
.shopcard .shopimg{height:112px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.shopcard .shopimg .ph,.castlecard .cimg .ph{max-height:100%;max-width:100%;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(0,0,0,.24))}
.shopcard .ph-emo,.castlecard .ph-emo{font-size:64px;line-height:1}
.shopcard b,.castlecard b{font-size:15px;text-align:center;line-height:1.15}
.shopcard .pr,.castlecard .pr{font-weight:700;font-size:16px;display:flex;align-items:center;gap:3px;color:#9a6a00}
.shopcard .pr svg,.castlecard .pr svg{width:17px;height:17px}
.shopcard.lux{background:linear-gradient(180deg,#fffaf0,#f6e7c4);border-color:#e7c77f}
.shopcard.lux::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 2px rgba(222,170,60,.6);pointer-events:none}
.shopcard.poor .shopimg,.castlecard.poor .cimg{opacity:.6;filter:grayscale(.3)}
.shopcard .need{font-size:12.5px;color:#7b8794}
.castles{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:12px;margin-bottom:12px}
.castlecard .cimg{height:124px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.castlecard.on{border-color:var(--gold);box-shadow:inset 0 0 0 3px var(--gold),0 4px 14px rgba(0,0,0,.1)}
.castlecard.on .pr{color:var(--good)}
.castlecard.ask{border-color:var(--warm);box-shadow:inset 0 0 0 3px var(--warm)}
.castlecard.ask .pr{color:var(--warm);font-size:14px}
.swatch.tone{border:1.5px solid rgba(255,255,255,.7)}
.giftpic{display:block;height:130px;width:auto;margin:4px auto 0;filter:drop-shadow(0 8px 10px rgba(0,0,0,.25))}
@media (max-width:640px){.cw-arrow{width:46px;height:46px}.cw-arrow svg{width:24px;height:24px}.sheet .shop{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}.shopcard .shopimg{height:92px}}

/* ======================= dark colour styles (chosen in "Meine Welt") ======================= */
:root[data-tone]{color-scheme:dark;--shade:rgba(0,0,0,.42);--paper:#fdfcff;--paper-ink:#181a2c}
:root[data-tone="mitternacht"]{--sky1:#060a22;--sky2:#141d4a;--sky3:#2a3570;--far:#1a2252;--hill1:#141a40;--hill2:#0b1030;--ink:#eef1ff;--ink-soft:#b8c2ee;--accent:#f2c14e;--accent-2:#6d7fe0;--accent-ink:#1b1606;--glass:rgba(16,22,58,.72);--glass-2:rgba(26,34,80,.5);--glass-line:rgba(170,186,255,.34);--paper-2:#eef0fb;--paper-line:#dcdff2;--veil:rgba(2,4,16,.66)}
:root[data-tone="smaragd"]{--sky1:#03140e;--sky2:#0a2c21;--sky3:#155440;--far:#0f3728;--hill1:#0b2a1f;--hill2:#061a13;--ink:#e8fbf2;--ink-soft:#a9dcc6;--accent:#f2c14e;--accent-2:#3fb68b;--accent-ink:#10261c;--glass:rgba(6,34,25,.72);--glass-2:rgba(10,48,36,.5);--glass-line:rgba(140,230,190,.3);--paper-2:#ecf7f2;--paper-ink:#10261c;--paper-line:#d3eadf;--veil:rgba(1,10,7,.66)}
:root[data-tone="bordeaux"]{--sky1:#160409;--sky2:#3a0c19;--sky3:#651a2f;--far:#42101f;--hill1:#330b18;--hill2:#1e050d;--ink:#fff0f4;--ink-soft:#f0b9c6;--accent:#ffb38a;--accent-2:#d4577a;--accent-ink:#2a0711;--glass:rgba(46,8,20,.72);--glass-2:rgba(64,14,30,.5);--glass-line:rgba(255,170,190,.3);--paper-2:#fbeef1;--paper-ink:#2a0b14;--paper-line:#f0d5dc;--veil:rgba(12,2,5,.66)}
:root[data-tone="anthrazit"]{--sky1:#0c0e10;--sky2:#1b1f23;--sky3:#30373e;--far:#252a30;--hill1:#1c2024;--hill2:#111316;--ink:#f0f4f6;--ink-soft:#b5c0c7;--accent:#4fd1c5;--accent-2:#5c7a8a;--accent-ink:#06201d;--glass:rgba(22,26,30,.74);--glass-2:rgba(34,40,46,.52);--glass-line:rgba(200,215,225,.25);--paper-2:#eef1f3;--paper-ink:#15191c;--paper-line:#dde3e7;--veil:rgba(4,5,6,.66)}
:root[data-tone="violett"]{--sky1:#10051c;--sky2:#2a0f47;--sky3:#4c247a;--far:#2e1352;--hill1:#241043;--hill2:#160829;--ink:#f8f0ff;--ink-soft:#d3bdf0;--accent:#ff8fd0;--accent-2:#9a6cf0;--accent-ink:#2c0a22;--glass:rgba(30,12,54,.72);--glass-2:rgba(44,18,76,.5);--glass-line:rgba(220,180,255,.3);--paper-2:#f3ecfb;--paper-ink:#1f1033;--paper-line:#e6daf3;--veil:rgba(8,2,14,.66)}
:root[data-tone] .sheet .h2,:root[data-tone] .psec .h2,:root[data-tone] .sheet .note{color:var(--paper-ink)}

/* ======================= Gold-Jagd ======================= */
.gold-screen{gap:0}
.gold-wrap{position:relative;flex:1;min-height:320px;border-radius:26px;overflow:hidden;box-shadow:0 10px 30px var(--shade);touch-action:none;background:#5a3b22;user-select:none;-webkit-user-select:none}
.gold-cv{position:absolute;inset:0;display:block;touch-action:none}
.gold-hud{position:absolute;left:0;right:0;top:0;pointer-events:none}
.gp{position:absolute;top:6px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:70px}
.gp-av{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff,#eef2f6 60%,#d3dbe4);box-shadow:0 0 0 3px var(--c),0 4px 10px rgba(0,0,0,.28);display:grid;place-items:center;overflow:hidden;flex:none}
.gp-img{width:82%;height:82%;object-fit:contain}
.gp-av .ph-emo{font-size:30px}
.gp.me .gp-av{width:60px;height:60px;box-shadow:0 0 0 4px var(--c),0 0 18px rgba(255,210,90,.85)}
.gp-name{font-weight:700;font-size:13.5px;color:#21324a;background:rgba(255,255,255,.85);padding:0 8px;border-radius:99px;margin-top:3px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gp-score{font-size:16px;font-weight:700;color:#7a4c00;background:linear-gradient(180deg,#fff6d0,#ffd970);padding:0 10px;border-radius:99px;box-shadow:0 2px 6px rgba(0,0,0,.2);font-variant-numeric:tabular-nums}
.gp-score.up{animation:pop .4s}
.gp-bub{position:absolute;left:calc(50% + 36px);top:4px;background:#fff;color:#1d2a3a;font-weight:700;font-size:14.5px;padding:6px 11px;border-radius:14px 14px 14px 4px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.22);z-index:3}
.gp:last-child .gp-bub{left:auto;right:calc(50% + 36px);border-radius:14px 14px 4px 14px}
.gp-bub.in{animation:bubin .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes bubin{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.gp-av.wob{animation:gwob .7s}
@keyframes gwob{0%,100%{transform:rotate(0)}20%{transform:rotate(-20deg)}40%{transform:rotate(15deg)}60%{transform:rotate(-9deg)}80%{transform:rotate(5deg)}}
.gp-av.jump{animation:gjump .6s}
@keyframes gjump{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px) scale(1.1)}70%{transform:translateY(2px) scale(.95)}}
.gp-av.spin{animation:gspin .8s}
@keyframes gspin{to{transform:rotate(360deg)}}
.gold-timer{position:absolute;left:12px;top:10px;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.85);font-weight:700;font-size:20px;color:#21324a;box-shadow:0 3px 10px rgba(0,0,0,.18);font-variant-numeric:tabular-nums;pointer-events:none}
.gold-timer svg{width:20px;height:20px}
.gold-timer.low{background:#ffe1dc;color:#c0392b;animation:pulse 1s infinite}
.gold-target{position:absolute;right:12px;top:10px;display:flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:99px;background:rgba(255,255,255,.88);box-shadow:0 3px 10px rgba(0,0,0,.18);font-weight:700;color:#7a4c00;font-size:16px}
.gold-target .coin{display:grid;place-items:center;min-width:58px;height:44px;padding:0 10px;border-radius:99px;background:radial-gradient(circle at 35% 30%,#fff6c8,#f2c14e 60%,#b47d14);color:#4a2c00;font-size:24px;font-family:var(--font-read);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.gold-cd{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);font-size:92px;font-weight:700;color:#fff;text-shadow:0 6px 20px rgba(0,0,0,.5);pointer-events:none;font-family:var(--font-show)}
.gold-cd.in{animation:cdin .7s ease-out}
@keyframes cdin{from{transform:translate(-50%,-50%) scale(1.8);opacity:0}30%{opacity:1}to{transform:translate(-50%,-50%) scale(1);opacity:.95}}
.gold-end{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,12,4,.45);animation:fadeup .4s;z-index:5}
.gold-card{background:var(--paper);color:var(--paper-ink);border-radius:28px;padding:22px 26px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.4);max-width:92%}
.gold-card .h2{color:var(--paper-ink);margin:0;text-align:center}
.gold-podium{display:flex;align-items:flex-end;gap:14px;margin:6px 0 4px}
.pod{display:flex;flex-direction:column;align-items:center;gap:4px}
.pod.p1{order:2}.pod.p2{order:1}.pod.p3{order:3}
.pod i{display:grid;place-items:center;width:86px;border-radius:12px 12px 0 0;background:linear-gradient(180deg,#ffe58a,#e0a82a);color:#6a4300;font-style:normal;font-weight:700;font-size:26px}
.pod.p1 i{height:96px}.pod.p2 i{height:66px;background:linear-gradient(180deg,#eef2f6,#b8c3ce);color:#3b4652}.pod.p3 i{height:46px;background:linear-gradient(180deg,#f5d0b0,#c98a5a);color:#5a3010}
.pod .pts{font-weight:700;color:#7a4c00;font-variant-numeric:tabular-nums}
.pod .gp-av.big{width:68px;height:68px}
.pod.me b{color:var(--accent)}
@media (max-aspect-ratio:1/1){.gold-timer,.gold-target{top:auto;bottom:10px}}
@media (max-width:600px){.gp-bub{font-size:12.5px}.gp{min-width:60px}.gp-av{width:44px;height:44px}.gp.me .gp-av{width:50px;height:50px}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* ======== castle care, effects and bot attacks ======== */
.cw-castle{pointer-events:auto;cursor:pointer}
.cw-castle.wob{animation:cwob .6s}
@keyframes cwob{0%,100%{transform:translate(-50%,-100%)}25%{transform:translate(-50%,-100%) rotate(-1.4deg) scale(1.02,.98)}55%{transform:translate(-50%,-100%) rotate(1deg)}80%{transform:translate(-50%,-100%) rotate(-.4deg)}}
.cw-castle.dirty .cw-castle-img{filter:saturate(.75) brightness(.94) drop-shadow(0 10px 14px rgba(0,0,0,.28))!important}
.cw-dirt{position:absolute;inset:0;pointer-events:none}
.cw-dirt .splat{position:absolute;aspect-ratio:1;border-radius:46% 54% 40% 60%/55% 42% 58% 45%;background:radial-gradient(circle at 38% 36%,var(--c2) 0 18%,var(--c1) 46%,transparent 70%);filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));transition:opacity .15s}
.cw-dirt .splat::before,.cw-dirt .splat::after{content:'';position:absolute;border-radius:50%;background:var(--c1)}
.cw-dirt .splat::before{width:22%;height:22%;left:-8%;top:30%}
.cw-dirt .splat::after{width:14%;height:30%;left:56%;top:84%;border-radius:40% 40% 50% 50%}
.cw-dirt .splat.k-schnee{background:radial-gradient(circle at 40% 38%,#fff 0 30%,#e4eefb 52%,transparent 70%)}
.cw-dirt .splat.k-schnee::before,.cw-dirt .splat.k-schnee::after{background:#eef4fd}
.cw-dirt .crack{position:absolute;width:12%;transform:translate(-50%,-50%);opacity:.85}
.cw-dirt .crack svg{display:block;width:100%;height:auto}

.cl-back i,.cl-back .cl-ring,.cl-front>i,.cl-front>div{display:none}

.cl-host.cl-goldstaub-on .cl-gold{display:block;position:absolute;inset:-10% -15%}

.cl-host.cl-feuerwerk2-on .cl-fw{display:block;position:absolute;left:-20%;right:-20%;top:-45%;height:60%}

/* ===== neighbours ===== */
.nb{position:absolute;transform:translate(-50%,-100%);cursor:pointer}
.nb-img{display:block;height:100%;width:auto;max-width:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.25)) saturate(.95)}
.nb-sh{position:absolute;left:50%;bottom:-5%;width:110%;height:16%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.35),rgba(0,0,0,0) 70%)}
.nb-flag{position:absolute;left:50%;top:-6%;transform:translate(-50%,-100%);display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.9);border-radius:999px;padding:2px 10px 2px 2px;box-shadow:0 3px 10px rgba(0,0,0,.15);white-space:nowrap}
.nb-flag b{font-size:13px;color:#3a2e4c}
.nb-flag .rc-av{width:28px;height:28px}
.nb.wob{animation:cwob .5s}
.nb-snow{position:absolute;inset:0;pointer-events:none}
.nb-snow i{position:absolute;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:46% 54% 50% 50%/52% 46% 54% 48%;background:radial-gradient(circle at 40% 35%,#fff,#eef6ff 60%,#d6e8fa);box-shadow:0 2px 3px rgba(0,0,0,.1)}
.nb-fog{position:absolute;inset:-25% -30%;pointer-events:none;opacity:0;transition:opacity .5s}
.nb-fog i{position:absolute;width:60%;height:45%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.98),rgba(240,245,255,.8) 50%,rgba(255,255,255,0) 72%)}

.nb.fogging .nb-fog{opacity:1}
.nb.fogging .nb-fog i{animation:fogpuff 1.2s ease-in-out infinite alternate}
@keyframes fogpuff{to{transform:scale(1.2) translateX(6%)}}

.cw-wrap.battle .cw{cursor:crosshair}
.cw-wrap.battle .nb::after{content:'🎯';position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:30px;animation:pulse .6s infinite alternate;pointer-events:none}

:root[data-bg="photo"] #app{background:var(--abg-t) center/cover no-repeat,#cfe6f7}
@media (orientation:landscape){:root[data-bg="photo"] #app{background-image:var(--abg-w)}}
:root[data-bg="photo"] #app.ingame{background-image:linear-gradient(rgba(255,255,255,.38),rgba(255,255,255,.38)),var(--abg-t)}
@media (orientation:landscape){:root[data-bg="photo"] #app.ingame{background-image:linear-gradient(rgba(255,255,255,.38),rgba(255,255,255,.38)),var(--abg-w)}}

.bgbtn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px;border-radius:16px;font-size:13px;font-weight:700;color:var(--paper-ink,#2b2238);background:transparent}

.bgsw{display:block;width:100%;aspect-ratio:3/4;border-radius:12px;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
