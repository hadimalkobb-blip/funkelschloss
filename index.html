/* ===== card styles ===== */
:root[data-card="rosa"]{--paper:#fff6fa;--paper-2:#ffe3ef;--card-line:#ffc1dc;--card-glow:rgba(255,140,190,.28)}
:root[data-card="perlmutt"]{--paper:#ffffff;--paper-2:#f1ecff;--card-line:#ffffff;--card-glow:rgba(170,150,255,.3);--card-bg:linear-gradient(135deg,#ffffff 0%,#f4eaff 30%,#e6f4ff 58%,#fff0f7 82%,#ffffff 100%)}
:root[data-card="gold"]{--paper:#fffbf0;--paper-2:#fff3d4;--card-line:#f0c45a;--card-glow:rgba(240,190,70,.35)}
:root[data-card="lila"]{--paper:#f9f5ff;--paper-2:#ece1ff;--card-line:#cdb6ff;--card-glow:rgba(160,120,255,.28)}
:root[data-card="minze"]{--paper:#f3fffb;--paper-2:#dcf8ee;--card-line:#9fe3c8;--card-glow:rgba(80,200,160,.26)}
:root[data-card="bonbon"]{--paper:#fff8fb;--paper-2:#ffeaf3;--card-line:#ff9ec8;--card-glow:rgba(255,120,180,.3);--card-bg:radial-gradient(circle,rgba(255,158,200,.35) 0 3px,transparent 4px) 0 0/22px 22px,radial-gradient(circle,rgba(127,214,255,.35) 0 3px,transparent 4px) 11px 11px/22px 22px,#fff8fb}
:root:not([data-card="klassik"]) .tile{clip-path:none;border-radius:30px;background:var(--card-bg,linear-gradient(160deg,var(--paper) 0%,var(--paper-2) 100%));box-shadow:0 0 0 3px var(--card-line),0 10px 24px var(--card-glow)}
:root:not([data-card="klassik"]) .opt,:root:not([data-card="klassik"]) .bookcard,:root:not([data-card="klassik"]) .lgarden>*,:root:not([data-card="klassik"]) .paper,:root:not([data-card="klassik"]) .shopcard,:root:not([data-card="klassik"]) .castlecard{background:var(--card-bg,linear-gradient(160deg,var(--paper) 0%,var(--paper-2) 100%));box-shadow:0 0 0 2.5px var(--card-line),0 8px 20px var(--card-glow)}
:root[data-card="gold"] .tile{box-shadow:0 0 0 3px #f0c45a,0 0 0 6px #fff3c4,0 10px 26px var(--card-glow)}
:root[data-card="perlmutt"] .tile::after{content:'';position:absolute;inset:0;border-radius:30px;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.7) 45%,transparent 60%);background-size:250% 100%;animation:pearl 5s ease-in-out infinite;pointer-events:none}
@keyframes pearl{0%,100%{background-position:100% 0}50%{background-position:0 0}}
.cardsw{display:flex;gap:4px;width:100%;aspect-ratio:4/3;padding:8px;border-radius:12px;background:#eef1f6}
.cardsw i{flex:1;border-radius:6px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.12)}
.cardsw[data-cs="klassik"] i{border-radius:2px;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px)}
.cardsw[data-cs="rosa"] i{border-radius:12px;background:linear-gradient(160deg,#fff6fa,#ffe3ef);box-shadow:0 0 0 2px #ffc1dc}
.cardsw[data-cs="perlmutt"] i{border-radius:12px;background:linear-gradient(135deg,#fff,#f4eaff 30%,#e6f4ff 58%,#fff0f7 82%);box-shadow:0 0 0 2px #fff,0 2px 8px rgba(170,150,255,.4)}
.cardsw[data-cs="gold"] i{border-radius:12px;background:#fffbf0;box-shadow:0 0 0 2px #f0c45a}
.cardsw[data-cs="lila"] i{border-radius:12px;background:linear-gradient(160deg,#f9f5ff,#ece1ff);box-shadow:0 0 0 2px #cdb6ff}
.cardsw[data-cs="minze"] i{border-radius:12px;background:linear-gradient(160deg,#f3fffb,#dcf8ee);box-shadow:0 0 0 2px #9fe3c8}
.cardsw[data-cs="bonbon"] i{border-radius:12px;background:radial-gradient(circle,rgba(255,158,200,.6) 0 2px,transparent 3px) 0 0/10px 10px,#fff8fb;box-shadow:0 0 0 2px #ff9ec8}
/* ===== stronger fireworks ===== */
.cl-fw{overflow:visible}
.cl-host.cl-feuerwerk2-on .cl-fw{display:block;position:absolute;inset:-60% -40% 0;pointer-events:none}
.cl-fw .fwr{position:absolute;top:78%;width:5px;height:18px;margin-left:-2px;border-radius:3px;background:linear-gradient(180deg,var(--c),transparent);box-shadow:0 0 8px var(--c)}
@keyframes fwrise{from{transform:translateY(0);opacity:1}to{transform:translateY(calc(-1 * (80% - var(--y)) * 3));opacity:.9}}
.cl-fw .fwb{position:absolute;width:0;height:0}
.cl-fw .fwb .fwf{position:absolute;left:calc(var(--r) * -.4);top:calc(var(--r) * -.4);width:calc(var(--r) * .8);height:calc(var(--r) * .8);border-radius:50%;background:radial-gradient(circle,#fff,var(--c) 30%,transparent 70%);animation:fwflash .5s ease-out forwards}
@keyframes fwflash{from{transform:scale(.2);opacity:1}to{transform:scale(1.4);opacity:0}}
.cl-fw .fwb s{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px 3px var(--c),0 0 2px #fff;animation:fwb2 1.6s cubic-bezier(.15,.7,.3,1) forwards}
.cl-fw .fwb s:nth-child(3n){background:var(--c2);box-shadow:0 0 10px 3px var(--c2)}
@keyframes fwb2{0%{transform:rotate(var(--a)) translate(0) scale(1);opacity:1}55%{opacity:1}100%{transform:rotate(var(--a)) translate(var(--d)) translateY(26px) scale(.4);opacity:0}}
.nb .cl-ring i{transform:rotate(var(--a)) translate(70px) rotate(45deg);width:10px;height:10px}
.nb .cl-ring i::before,.nb .cl-ring i::after{width:10px;height:10px}
.nb .cl-ring i::before{left:-5px}.nb .cl-ring i::after{top:-5px}
.nb-snow i{border-radius:60% 40% 55% 45%/50% 60% 40% 50%;opacity:.95}
.fwctl{display:flex;flex-direction:column;gap:8px;background:var(--soft,#f4f0fb);border-radius:18px;padding:12px}
.fwrow{display:flex;flex-direction:column;gap:6px}
.fwrow b{font-size:15px;display:flex;gap:8px;align-items:baseline}
.fwrow small{font-weight:600;opacity:.75}
/* ===== bot moods ===== */
.race .rc{position:relative}
.bot-emo{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%) scale(0);font-style:normal;font-size:24px;line-height:1;z-index:5;pointer-events:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25));opacity:0;transition:opacity .2s}
.bot-emo.show{opacity:1;animation:moodpop .45s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes moodpop{to{transform:translate(-50%,-100%) scale(1)}}
.bot-emo.show.m-angry{animation:moodpop .45s cubic-bezier(.3,1.6,.5,1) forwards,moodshake .35s .45s 3}
.bot-emo.show.m-think{animation:moodpop .45s forwards,moodfloat 1.6s .45s ease-in-out infinite}
.bot-emo.show.m-idea{animation:moodpop .45s forwards,moodflash .5s .45s 3}
.bot-emo.show.m-love,.bot-emo.show.m-happy{animation:moodpop .45s forwards,moodbounce .5s .45s 3}
.bot-emo.show.m-sad{animation:moodpop .45s forwards,moodfall 1.4s .45s ease-in forwards}
@keyframes moodshake{0%,100%{transform:translate(-50%,-100%) scale(1)}25%{transform:translate(-62%,-100%) scale(1.1) rotate(-12deg)}75%{transform:translate(-38%,-100%) scale(1.1) rotate(12deg)}}
@keyframes moodfloat{50%{transform:translate(-50%,-125%) scale(1.05)}}
@keyframes moodflash{50%{transform:translate(-50%,-100%) scale(1.35);filter:drop-shadow(0 0 10px #ffe680)}}
@keyframes moodbounce{50%{transform:translate(-50%,-130%) scale(1.15)}}
@keyframes moodfall{to{transform:translate(-50%,-40%) scale(.8);opacity:.4}}
.nb .bot-emo{top:-14%;font-size:30px}
.qz-bots{margin:0 auto}
.qz-bots .rc.done{box-shadow:0 0 0 2px #2bd46b,0 2px 8px rgba(0,0,0,.08)}
.qz-bots .rc b{font-size:15px}
.race .rc-bub{bottom:auto;top:100%;margin:6px 0 0;z-index:6}
/* ===== card hub (categories as cards, 3 per row) ===== */
.hub{display:flex;flex-direction:column;gap:12px}
.hub-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:620px;margin:0 auto}
.hubcard{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:104px;padding:12px 6px 10px;border-radius:22px;
  background:#fff;background:linear-gradient(165deg,color-mix(in srgb,var(--hc) 26%,#fff),#fff 78%);border:2px solid color-mix(in srgb,var(--hc) 40%,transparent);
  color:var(--paper-ink,#2b2238);box-shadow:0 4px 12px rgba(0,0,0,.08);transition:transform .15s}
.hubcard:active{transform:scale(.95)}
.hubcard .hc-emo{font-size:38px;line-height:1;filter:drop-shadow(0 3px 3px rgba(0,0,0,.15))}
.hubcard b{font-size:14.5px;line-height:1.1;text-align:center;font-weight:800}
.hc-badge{position:absolute;top:6px;right:6px;font-style:normal;font-size:11.5px;font-weight:800;background:#fff;color:#6b4e00;border-radius:999px;padding:2px 7px;box-shadow:0 1px 5px rgba(0,0,0,.14)}
.hub-head{position:sticky;top:-2px;z-index:4;display:flex;align-items:center;gap:10px;padding:6px 4px 8px;background:var(--paper,#fff);border-bottom:3px solid color-mix(in srgb,var(--hc) 45%,transparent)}
.hub-head .hc-emo{font-size:28px;line-height:1}
.hub-head b{font-size:20px;font-weight:800;flex:1}
.hub-back{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--hc) 22%,#fff);color:var(--paper-ink,#2b2238);box-shadow:0 2px 8px rgba(0,0,0,.12);flex:none}
.hub-back svg{width:26px;height:26px}
.hub-box{display:flex;flex-direction:column;gap:12px}
.hub-box.items{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.hub-sub{grid-column:1/-1;margin:6px 0 0;font-weight:800;font-size:16px;color:var(--paper-ink,#2b2238)}
.hub-box .wide-note{grid-column:1/-1}
.starchip{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:17px;background:#fff6d6;color:#8a5a00;border-radius:999px;padding:5px 11px;box-shadow:inset 0 0 0 2px #f3d27a;font-variant-numeric:tabular-nums}
.starchip svg{width:18px;height:18px}
/* compact item cards */
.hub-box .shopcard{padding:8px 5px 8px;border-radius:18px;gap:3px;min-width:0}
.hub-box .shopcard .shopimg{height:78px}
.hub-box .shopcard b{font-size:13px;overflow-wrap:anywhere}
.hub-box .shopcard .pr{font-size:14.5px}
.hub-box .shopcard .ph-emo{font-size:52px}
.hub-box .shopcard .fxico{transform:scale(.85)}
.own-n{position:absolute;top:5px;left:6px;font-style:normal;font-size:11.5px;font-weight:800;color:#fff;background:#3fae5c;border-radius:999px;padding:1px 6px}
.needbar{display:block;width:72%;height:6px;border-radius:9px;background:rgba(0,0,0,.09);overflow:hidden}
.needbar>i{display:block;height:100%;background:linear-gradient(90deg,#ffd34d,#f0a020);border-radius:inherit}
.askbar{display:none;position:absolute;left:6px;right:6px;bottom:6px;padding:7px 4px;border-radius:12px;background:#3fae5c;color:#fff;font-weight:800;font-size:14px;box-shadow:0 3px 10px rgba(40,140,70,.4);animation:askpop .25s}
.shopcard.ask{outline:4px solid #3fae5c;outline-offset:-2px;transform:scale(1.03);z-index:2}
.shopcard.ask .askbar{display:block}
@keyframes askpop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.mini-sw{display:inline-block;width:42px;height:24px;border-radius:99px;background:#cfd6de;position:relative;transition:background .2s}
.mini-sw i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.mini-sw.on{background:#3fae5c}.mini-sw.on i{left:21px}
.carestat{display:flex;gap:10px;justify-content:center}
.carestat span{background:var(--soft,#f4f0fb);border-radius:999px;padding:6px 14px;font-size:17px}
/* worlds + options 3 per row */
.hub .worlds{grid-template-columns:repeat(3,1fr);gap:9px}
.hub .worldbtn{height:104px;border-radius:18px}
.hub .worldbtn span{font-size:13.5px;left:8px;bottom:7px;right:6px;line-height:1.1}
.hub .worldbtn .wprice{font-size:12px;top:5px;right:5px;padding:2px 7px}
.hub .bgrow{grid-template-columns:repeat(3,1fr)}

.fwctl{display:flex;flex-direction:column;gap:8px}

.worldbtn .wprice svg{position:static;inset:auto}
.askbar{display:none;align-items:center;justify-content:center;gap:3px}
.shopcard.ask .askbar{display:flex}

.kb{position:absolute;transform:translate(-50%,-100%);transform-origin:50% 100%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;line-height:1}

.kb.pop{animation:dkpop .6s}
.kb.wob{animation:dkpop .5s}
.kb[data-lv="2"] .ph{filter:drop-shadow(0 4px 5px rgba(0,0,0,.28)) drop-shadow(0 0 6px rgba(255,220,120,.55))}
.kb[data-lv="3"] .ph{filter:drop-shadow(0 4px 5px rgba(0,0,0,.28)) drop-shadow(0 0 10px rgba(255,210,90,.85))}
.kb-lv{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);font-size:13px;letter-spacing:1px;color:#ffd34d;text-shadow:0 1px 2px rgba(0,0,0,.7);white-space:nowrap;pointer-events:none}
.kb-coin{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);display:flex;align-items:center;gap:3px;padding:4px 10px 4px 5px;border-radius:999px;background:#fffdf3;color:#7a5200;font-weight:800;font-size:16px;box-shadow:0 4px 12px rgba(0,0,0,.25),inset 0 0 0 2px #f3d27a;animation:coinbob 1.6s ease-in-out infinite;touch-action:manipulation;z-index:2}
.kb-coin span svg{width:24px;height:24px;display:block}
.kb-coin.full{background:linear-gradient(180deg,#fff3b0,#ffd34d);animation:coinbob 1.6s ease-in-out infinite,coinglow 1.2s ease-in-out infinite}
@keyframes coinbob{0%,100%{translate:0 0}50%{translate:0 -6px}}
@keyframes coinglow{0%,100%{box-shadow:0 4px 12px rgba(0,0,0,.25),0 0 0 0 rgba(255,211,77,.7)}50%{box-shadow:0 4px 12px rgba(0,0,0,.25),0 0 0 8px rgba(255,211,77,0)}}
.kb-puff{position:absolute;left:58%;top:4%;width:22%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.85),rgba(255,255,255,0) 70%);opacity:0;pointer-events:none}
.kb.working .kb-puff{animation:puff 2.6s ease-out infinite}
.kb-mine .kb-puff{left:40%;top:30%;background:radial-gradient(circle,rgba(255,230,140,.9),rgba(255,200,80,0) 70%)}
@keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.4)}20%{opacity:.9}100%{opacity:0;transform:translate(10%,-140%) scale(1.6)}}
.cw-wrap.night .kb .ph{filter:brightness(.7) saturate(.85) drop-shadow(0 3px 4px rgba(0,0,0,.3))}
/* build sheet */
.kg-status{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:620px;margin:0 auto}
.kg-chip{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:var(--paper-2,#f6f3fb);color:var(--paper-ink,#2b2238);font-size:15px;box-shadow:inset 0 0 0 1.5px var(--paper-line,#e3e0ea)}
.kg-chip b{font-variant-numeric:tabular-nums}
.kg-status.big .kg-chip{flex-direction:column;gap:2px;padding:12px 18px;border-radius:20px;font-size:26px}
.kg-status.big .kg-chip small{font-size:12px;opacity:.7}
.goldchip{background:#fff6d6;color:#7a5200}
.kbcard .kb-ben{font-size:13px;font-weight:800;color:#2f7a3e;background:#e8f7ea;border-radius:999px;padding:2px 8px}
.kbcard .kb-stars,.kb-stars{color:#e8a91a;letter-spacing:1px;font-size:15px}
.kb-stars.big{font-size:22px}
.kbcard .kb-pay,.kb-up .kb-pay{font-size:12px;color:#7b8794;font-weight:700}
.kbcard.owned{background:linear-gradient(180deg,#fffdf3,#f6efd6);border-color:#ead79b}
.needbar.gold>i{background:linear-gradient(90deg,#ffe28a,#e0a020)}
.shopcard .hap{position:absolute;top:5px;right:6px;font-style:normal;font-size:11px;font-weight:800;color:#c2406f;background:#fff0f6;border-radius:999px;padding:1px 6px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.kb-sheet{gap:14px}
.kb-top{display:flex;gap:16px;align-items:center}
.kb-img{width:120px;height:120px;flex:none;display:flex;align-items:flex-end;justify-content:center}
.kb-img .ph{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.kb-name{font-size:22px}
.kb-now{font-weight:800;color:#2f7a3e;margin-top:4px}
.kb-store{margin:0;font-weight:700;color:#7a5200;background:#fff6d6;border-radius:14px;padding:8px 12px;text-align:center}
.kb-up{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:10px;padding:14px;min-height:72px}
.kb-up .kb-up-l{font-weight:800;color:#8a5a00}
.kb-max{text-align:center;font-weight:800;font-size:18px;margin:0}
.kb-tip{text-align:center;margin:0}
/* settings */
.lng{display:inline-flex;align-items:center;gap:3px;font-weight:900;font-size:22px;color:#2b5ea8}
.lng i{font-style:normal;font-size:14px;opacity:.6}
.lng .ar,.lng.ar{font-family:var(--font-ar);color:#0f7a54;font-size:24px}
.tempo-val{display:block;text-align:center;font-size:18px;color:#5b6573;margin-top:-4px}
/* raid alarm */
.raid-alarm{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(120,10,20,.25),rgba(40,0,10,.55));animation:fadein .3s}
.raid-alarm::before{content:'';position:absolute;inset:0;box-shadow:inset 0 0 0 6px rgba(255,80,80,.7),inset 0 0 60px rgba(255,40,40,.6);animation:alarmpulse 1s ease-in-out infinite;pointer-events:none}
@keyframes alarmpulse{50%{opacity:.35}}
.ra-card{position:relative;background:var(--paper,#fff);color:var(--paper-ink,#222);border-radius:28px;padding:22px 24px;max-width:min(440px,90%);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4);animation:dkpops .5s}
.ra-card b{font-size:23px;color:#b4232f}
.ra-card p{margin:0;font-size:17px}
.ra-gear{width:76px;height:76px}
.ra-gear svg,.bt-rg svg,.fl-gear svg,.bt-spin svg{width:100%;height:100%;display:block}
.gspin{transform-origin:32px 32px;animation:gspin 6s linear infinite}
@keyframes gspin{to{transform:rotate(360deg)}}
/* ---------- film ---------- */
.film{position:fixed;inset:0;z-index:60;overflow:hidden;background:#04061a;color:#fff;animation:fadein .5s}
.film.out{animation:fadeout .6s forwards}
@keyframes fadeout{to{opacity:0}}
.fl-cam{position:absolute;inset:-6%;transform-origin:60% 70%;transition:transform 6s cubic-bezier(.45,.05,.3,1)}
.fl-sky,.fl-sky2,.fl-sky3{position:absolute;inset:0;transition:opacity 2.4s}
.fl-sky{background:linear-gradient(180deg,#02041a 0%,#0b1446 55%,#25306e 100%)}
.fl-sky2{background:linear-gradient(180deg,#3d3b8f 0%,#d67fa6 52%,#ffc9a0 70%);opacity:0}
.fl-sky3{background:linear-gradient(180deg,#78b9ee 0%,#d9eeff 52%,#f4faff 70%);opacity:0}
.fl-stars{position:absolute;inset:0;width:100%;height:100%;transition:opacity 2s}
.fl-sun{position:absolute;right:16%;top:34%;width:16vmin;height:16vmin;border-radius:50%;background:radial-gradient(circle,#fff8d8 0%,#ffd88a 35%,rgba(255,190,110,0) 70%);opacity:0;transition:opacity 2s,top 5s}
.fl-moon{position:absolute;right:16%;top:15%;width:12vmin;filter:drop-shadow(0 0 30px rgba(220,230,255,.6));transition:opacity 2s}
.fl-cloud{position:absolute;width:30vmin;opacity:0;transition:opacity 2s;animation:flcloud 40s linear infinite}
.fl-cloud.c1{top:12%;left:8%}.fl-cloud.c2{top:20%;left:55%;width:24vmin;animation-duration:55s}
@keyframes flcloud{to{translate:12vw 0}}
.fl-mtn{position:absolute;left:0;right:0;bottom:30%;height:24vmin;background-size:auto 100%;background-repeat:repeat-x;filter:brightness(.35) saturate(.6);transition:filter 2.4s}
.fl-forest{position:absolute;left:0;right:0;bottom:22%;height:16vmin;background-size:auto 100%;background-repeat:repeat-x;filter:brightness(.3) saturate(.6);transition:filter 2.4s}
.fl-ground{position:absolute;left:0;right:0;bottom:0;height:24%;background-size:30vmin;filter:brightness(.3);transition:filter 2.4s}
.fl-ground::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(0,0,0,.25))}
.fl-castlewrap{position:absolute;left:50%;bottom:17%;height:52vmin;transform:translateX(-50%) scale(.9);opacity:0;transition:opacity 2s,transform 4s,filter 2s;filter:brightness(.5)}
.fl-castle{height:100%;width:auto;display:block;filter:drop-shadow(0 12px 18px rgba(0,0,0,.45))}
.fl-glow{position:absolute;left:50%;top:55%;width:150%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,226,140,.75),rgba(255,200,90,0) 62%);opacity:0;transition:opacity 1.6s;mix-blend-mode:screen}
.fl-mach{position:absolute;inset:0;pointer-events:none}
.fl-m{position:absolute;bottom:16%;height:14vmin;filter:brightness(.18) contrast(1.2);opacity:0;transform:translateX(60vw);transition:transform 4.5s cubic-bezier(.2,.6,.3,1),opacity 1s}
.fl-m.m0{height:26vmin;right:6%}.fl-m.m1{right:30%;height:15vmin}.fl-m.m2{right:44%;height:11vmin}.fl-m.m3{right:22%;bottom:52%;height:20vmin}
.fl-dust{position:absolute;right:0;bottom:12%;width:70%;height:16vmin;background:radial-gradient(ellipse at 70% 80%,rgba(120,100,80,.55),rgba(120,100,80,0) 60%);opacity:0;transition:opacity 2s}
.fl-build{position:absolute;inset:0;pointer-events:none}
.fl-b{position:absolute;bottom:14%;height:15vmin;opacity:0;transform:scale(.2);transform-origin:50% 100%;filter:drop-shadow(0 8px 10px rgba(0,0,0,.4))}
.fl-b.b0{left:8%}.fl-b.b1{left:20%;height:19vmin}.fl-b.b2{right:20%;height:17vmin}.fl-b.b3{right:7%}.fl-b.b4{left:31%;height:17vmin;bottom:12%}.fl-b.b5{right:31%;height:10vmin;bottom:11%}
.fl-letters{position:absolute;inset:0;pointer-events:none}
.fl-letters i{position:absolute;left:var(--x);bottom:32%;font-style:normal;font-family:var(--font-show);font-weight:700;font-size:10vmin;color:#fff3b0;text-shadow:0 0 14px #ffd34d,0 0 30px #ffb020;opacity:0}
.fl-title{position:absolute;left:0;right:0;top:22%;text-align:center;opacity:0;transform:scale(.92);transition:opacity 1.6s,transform 3s}
.fl-title b{display:block;font-family:var(--font-show);font-size:clamp(40px,10vmin,110px);letter-spacing:.04em;background:linear-gradient(100deg,#fff6c9 0%,#ffd34d 35%,#fffbe8 50%,#e6a51c 65%,#fff1b0 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(255,190,60,.55));animation:shine 4s linear infinite}
.fl-title small{display:block;margin-top:8px;font-size:clamp(16px,3vmin,26px);letter-spacing:.25em;text-transform:uppercase;color:#e8dcff}
@keyframes shine{to{background-position:-250% 0}}
.fl-gear{position:absolute;right:5%;top:12%;width:16vmin;height:16vmin;opacity:0;transform:scale(.4) rotate(-40deg);transition:opacity 1s,transform 1.2s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 0 20px rgba(255,120,60,.6))}
.fl-bar{position:absolute;left:0;right:0;height:9vh;background:#000;z-index:3;transition:transform 1s}
.fl-bar.t{top:0}.fl-bar.b{bottom:0}
.fl-vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.55));pointer-events:none;z-index:2}
.fl-sub{position:absolute;left:0;right:0;bottom:9vh;z-index:4;text-align:center;opacity:0;padding:34px 5% 14px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.62) 45%)}
.fl-sub.in{animation:subin .8s forwards}
@keyframes subin{to{opacity:1}}
.fl-sub p{margin:4px auto;max-width:900px;text-shadow:0 2px 8px #000,0 0 2px #000}
.fl-sub .de{font-size:clamp(18px,3.2vmin,30px);font-weight:700}
.fl-sub .ar{font-family:var(--font-ar);direction:rtl;font-size:clamp(17px,3vmin,28px);color:#ffe9b0}
.fl-sub p:empty{display:none}
.fl-skip{position:absolute;right:16px;top:calc(9vh + 12px);z-index:5;background:rgba(255,255,255,.16);color:#fff;border:1.5px solid rgba(255,255,255,.4);border-radius:999px;padding:9px 16px;font-weight:700;font-size:15px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.fl-go{position:absolute;left:50%;bottom:calc(9vh + 90px);transform:translateX(-50%);z-index:5;animation:dkpops .6s,gopulse 1.6s ease-in-out .6s infinite}
@keyframes gopulse{50%{box-shadow:0 0 0 14px rgba(255,211,77,0),0 8px 0 rgba(0,0,0,.15)}}
/* scenes */
.film[data-scene="title"] .fl-title{opacity:1;transform:scale(1)}
.film[data-scene="title"] .fl-cam{transform:scale(1.12) translateY(4%)}
.film[data-scene="castle"] .fl-cam,.film[data-scene="build"] .fl-cam{transform:scale(1)}
.film[data-scene="castle"] .fl-sky2,.film[data-scene="rival"] .fl-sky2{opacity:1}
.film[data-scene="castle"] .fl-sun{opacity:1;top:28%}
.film[data-scene="castle"] .fl-stars,.film[data-scene="build"] .fl-stars,.film[data-scene="power"] .fl-stars{opacity:0}
.film[data-scene="castle"] .fl-moon,.film[data-scene="build"] .fl-moon,.film[data-scene="power"] .fl-moon{opacity:0}
.film[data-scene="castle"] .fl-mtn,.film[data-scene="build"] .fl-mtn,.film[data-scene="power"] .fl-mtn{filter:none}
.film[data-scene="castle"] .fl-forest,.film[data-scene="build"] .fl-forest,.film[data-scene="power"] .fl-forest{filter:none}
.film[data-scene="castle"] .fl-ground,.film[data-scene="build"] .fl-ground,.film[data-scene="power"] .fl-ground{filter:none}
.film:is([data-scene="castle"],[data-scene="rival"],[data-scene="build"],[data-scene="power"]) .fl-castlewrap{opacity:1;filter:none;transform:translateX(-50%) scale(1)}
.film:is([data-scene="castle"],[data-scene="build"]) .fl-cloud{opacity:.9}
.film[data-scene="castle"] .fl-glow{opacity:.55}
.film[data-scene="rival"] .fl-cam{transform:scale(1.08) translateX(-4%)}
.film[data-scene="rival"] .fl-mtn,.film[data-scene="rival"] .fl-forest{filter:brightness(.55) sepia(.3) hue-rotate(-20deg)}
.film[data-scene="rival"] .fl-ground{filter:brightness(.6) sepia(.25)}
.film[data-scene="rival"] .fl-castlewrap{transform:translateX(-95%) scale(.85)}
.film[data-scene="rival"] .fl-m{opacity:1;transform:translateX(0)}
.film[data-scene="rival"] .fl-m.m3{animation:flfloat 3s ease-in-out infinite}
.film[data-scene="rival"] .fl-dust{opacity:1}
.film[data-scene="rival"] .fl-gear{opacity:1;transform:scale(1) rotate(0)}
.film[data-scene="rival"] .fl-stars{opacity:.3}
@keyframes flfloat{50%{translate:0 -10px}}
.film:is([data-scene="build"],[data-scene="power"]) .fl-sky3{opacity:1}
.film[data-scene="build"] .fl-b{animation:flpop .6s cubic-bezier(.3,1.6,.5,1) forwards}
.film[data-scene="build"] .fl-b.b1{animation-delay:.42s}.film[data-scene="build"] .fl-b.b2{animation-delay:.84s}.film[data-scene="build"] .fl-b.b3{animation-delay:1.26s}.film[data-scene="build"] .fl-b.b4{animation-delay:1.68s}.film[data-scene="build"] .fl-b.b5{animation-delay:2.1s}
.film[data-scene="power"] .fl-b{opacity:1;transform:scale(1)}
@keyframes flpop{to{opacity:1;transform:scale(1)}}
.film[data-scene="power"] .fl-letters i{animation:flfly 2.6s ease-in forwards;animation-delay:calc(var(--i) * .16s)}
@keyframes flfly{0%{opacity:0;transform:translate(0,30vh) scale(.6)}25%{opacity:1;transform:translate(0,0) scale(1.1)}100%{opacity:0;bottom:48%;left:50%;transform:translate(-50%,0) scale(.25)}}
.film[data-scene="power"] .fl-glow{opacity:1;animation:glowp 1.4s ease-in-out infinite}
.film[data-scene="power"] .fl-cam{transform:scale(1.05)}
@keyframes glowp{50%{opacity:.6}}
/* ---------- battle ---------- */
.bt-screen{position:relative;padding:0!important;overflow:hidden;background:#0d1530;touch-action:none;user-select:none;-webkit-user-select:none}
.bt-cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.bt-hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column}
.bt-hud button{pointer-events:auto}
.bt-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;padding:10px 12px 0}
.bt-left{display:flex;justify-content:flex-start}
.bt-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.bt-waves{display:flex;gap:5px}
.bt-waves i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:14px;background:rgba(255,255,255,.55);color:#3a3a5a;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.bt-waves i.now{background:#ffd34d;color:#4a3300;transform:scale(1.15)}
.bt-waves i.done{background:#5cc46e;color:#fff}
.bt-waves i.boss{font-size:15px}
.bt-prompt{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 16px;border-radius:999px;background:rgba(255,253,243,.95);box-shadow:0 6px 18px rgba(0,0,0,.28),inset 0 0 0 3px #f3d27a;color:#3a2412;min-height:64px}
.bt-prompt.pop{animation:dkpops .45s}
.bt-prompt small{font-weight:800;font-size:14px;color:#8a5a00;text-transform:uppercase;letter-spacing:.06em}
.bt-glyph{font-family:var(--font-read);font-size:42px;line-height:1;min-width:42px;text-align:center;display:flex;gap:4px}
.bt-glyph span{display:inline-block;padding:0 3px;border-radius:8px;color:#b8a48a}
.bt-glyph span.ok{color:#2f8f46}
.bt-glyph span.now{color:#3a2412;background:#ffe28a;box-shadow:0 0 0 2px #e0a020}
.bt-say{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#ffe08a,#f2b33d);color:#4a3300;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.bt-say svg{width:26px;height:26px}
.bt-hp{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.85);border-radius:999px;padding:5px 10px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.bt-hp small{font-weight:800;font-size:13px;color:#5b4a3a;min-width:22px;text-align:right;font-variant-numeric:tabular-nums}
.bt-hpbar{width:110px;height:12px;border-radius:99px;background:rgba(0,0,0,.15);overflow:hidden}
.bt-hpbar i{display:block;height:100%;width:100%;border-radius:inherit;background:linear-gradient(90deg,#8fdc6f,#3fae5c);transition:width .25s}
.bt-hp.low .bt-hpbar i{background:linear-gradient(90deg,#ff9a8a,#e0505e)}
.bt-hp.low{animation:alarmpulse .8s ease-in-out infinite}
.bt-hp.shield{box-shadow:0 0 0 3px #7fc8ff,0 2px 8px rgba(0,0,0,.2)}
.bt-loot{display:flex;align-items:center;gap:4px;background:rgba(255,253,243,.92);border-radius:999px;padding:4px 12px 4px 5px;font-weight:800;color:#7a5200;font-size:17px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.bt-loot svg{width:24px;height:24px;display:block}
.bt-loot.bump{animation:bump .4s}
.bt-banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);opacity:0;font-family:var(--font-show);font-weight:700;font-size:clamp(30px,7vmin,64px);color:#fff6c9;text-shadow:0 4px 0 #8a5a00,0 0 26px rgba(255,190,60,.9),0 8px 20px rgba(0,0,0,.5);white-space:nowrap;pointer-events:none}
.bt-banner.show{animation:bannerin 1.7s ease forwards}
.bt-banner.boss{color:#ffd0d0;text-shadow:0 4px 0 #7a1020,0 0 26px rgba(255,80,80,.9),0 8px 20px rgba(0,0,0,.5)}
.bt-banner.ice{color:#e6f7ff;text-shadow:0 4px 0 #2f6f9f,0 0 26px rgba(120,200,255,.9)}
.bt-banner.good{color:#eaffd8;text-shadow:0 4px 0 #2f7a3e,0 0 26px rgba(120,255,140,.8)}
@keyframes bannerin{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.bt-rival{position:absolute;right:12px;top:118px;display:flex;align-items:center;gap:8px;max-width:min(420px,70%);background:rgba(40,28,18,.86);color:#ffe9c4;border-radius:18px;padding:8px 14px 8px 8px;box-shadow:0 6px 16px rgba(0,0,0,.35);font-weight:700;font-size:15px}
.bt-rival.in{animation:rivin .4s ease}
.bt-rival p{margin:0}
.bt-rival p.ar{font-family:var(--font-ar);direction:rtl}
.bt-rg{width:38px;height:38px;flex:none}
@keyframes rivin{from{opacity:0;transform:translateX(30px)}}
.bt-powers{position:absolute;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.bt-pow{position:relative;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:radial-gradient(circle at 35% 30%,#ffffff,#dfe8f5);box-shadow:0 5px 14px rgba(0,0,0,.3),inset 0 0 0 3px #fff}
.bt-pow .cd{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(20,30,60,.55) var(--p,0deg),transparent 0);pointer-events:none}
.bt-pow.ready{animation:powready 1.6s ease-in-out infinite}
.bt-pow.lock{filter:grayscale(1);opacity:.7}
.bt-pow .lk{position:absolute;right:-2px;bottom:-2px;font-style:normal;font-size:18px}
.bt-pow.shake{animation:shake .4s}

/* ===== together v2: avatar strip, flashes, quick chat ===== */
.tog-strip{position:relative;display:flex;align-items:flex-start;gap:8px;padding:6px 10px;margin:6px auto;max-width:860px;width:100%;box-sizing:border-box;border-radius:20px;background:rgba(255,255,255,.88);border:2px solid #eadcff;z-index:5}
.tog-row2{display:flex;flex-wrap:wrap;gap:8px;flex:1;min-width:0;justify-content:center}
.tp{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:62px;padding:2px 4px;border-radius:14px;transition:transform .2s}
.tp.me .tp-nm{color:var(--c)}
.tp.gone{opacity:.45}

.tp.ans .tp-av::after{content:"✔";position:absolute;right:-4px;bottom:-2px;font-size:12px;background:#2fc28a;color:#fff;border-radius:50%;width:17px;height:17px;display:grid;place-items:center;border:2px solid #fff}
.tp-av{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) var(--p,0%),#ece4fb 0);padding:3px;box-sizing:border-box;flex:none}

.tp-av.sm .tp-ini{font-size:15px}
.tp-av.xs{width:22px;height:22px;padding:1px;background:var(--c)}
.tp-av.xs .tp-ini{font-size:11px}
.tp-nm{font-size:12px;color:#3a2a55;max-width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-st{font-size:12px;font-weight:800}
.tp.fok .tp-av{animation:tpok .9s}
.tp.fno .tp-av{animation:tpno .9s}
@keyframes tpok{0%{box-shadow:0 0 0 0 #2fc28a}30%{box-shadow:0 0 0 8px rgba(47,194,138,.5);transform:scale(1.15)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes tpno{0%,100%{transform:none}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}30%{box-shadow:0 0 0 6px rgba(255,93,93,.5)}}
.tp-mark{position:absolute;top:-6px;right:2px;font-style:normal;font-weight:900;font-size:20px;animation:tpmark 1.1s forwards}
.tp.fok .tp-mark{color:#16a36a}.tp.fno .tp-mark{color:#e0453a}
@keyframes tpmark{from{opacity:1;transform:translateY(0) scale(1.3)}to{opacity:0;transform:translateY(-22px)}}
.tp-bub{position:absolute;top:calc(100% + 2px);left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff;border:3px solid var(--c);border-radius:16px;padding:4px 10px;font-weight:800;font-size:15px;color:#3a2a55;box-shadow:0 6px 14px rgba(0,0,0,.15);animation:bubin .3s;z-index:20}

.tog-pb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;border:2px solid #f0e8ff;background:#fbf8ff;cursor:pointer;font:inherit}
